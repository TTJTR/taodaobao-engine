openapi: 3.1.0
info:
  title: 淘到宝引擎 V1.1 演示渲染增量契约
  version: 1.1.1
  description: >-
    本文件仅描述冻结 openapi.yaml 之外的演示渲染增量能力。基础路径、鉴权、
    Idempotency-Key、统一成功/错误信封以及既有字段语义继续引用冻结主契约。
paths:
  /api/v1/solution-runs/{run_id}/interactive-presentations:
    post:
      summary: 基于已发布主张创建可信互动 HTML 演示任务
      description: >-
        仅接受 Trust Gate 已 RELEASE/DOWNGRADE 的方案。AI 可生成内联 HTML/CSS 视觉结构，
        交互由平台注入固定运行时；所有业务文字必须逐字绑定输入快照中的 Claim/Evidence，
        产物还必须通过静态安全审计。
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInteractivePresentationRequest'
      responses:
        '202': {description: 已创建互动演示任务，使用统一成功信封}
  /api/v1/presentations/{presentation_id}/artifact:
    get:
      summary: 在当前设备浏览器中打开或下载已审计互动 HTML
      description: >-
        仅返回状态为 ready 且事实绑定、安全审计均通过的互动 HTML。服务端不启动浏览器，
        HTML 的布局、动画和交互由访问者设备完成，并通过响应级 CSP sandbox 隔离。
      parameters:
        - name: presentation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: download
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 已审计单文件 HTML
          content:
            text/html:
              schema: {type: string}
        '409': {description: 任务未完成、已失效或审计未通过}
  /api/v1/style-profiles/{style_profile_id}/template-candidates:
    get:
      summary: 查询脱敏模板候选及容量校验结果
      parameters:
        - $ref: '#/components/parameters/StyleProfileId'
      responses:
        '200':
          description: 候选模板列表，使用统一成功信封
  /api/v1/style-profiles/{style_profile_id}/template-candidates/regenerate-preview:
    post:
      summary: 重新生成脱敏候选预览
      parameters:
        - $ref: '#/components/parameters/StyleProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_profile_version]
              properties:
                expected_profile_version: {type: integer, minimum: 1}
      responses:
        '200': {description: 新一代候选模板，使用统一成功信封}
  /api/v1/style-profiles/{style_profile_id}/template-candidates/{candidate_id}/confirm:
    post:
      summary: 人工确认候选模板并冻结编译快照
      parameters:
        - $ref: '#/components/parameters/StyleProfileId'
        - name: candidate_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_profile_version, expected_candidate_version]
              properties:
                expected_profile_version: {type: integer, minimum: 1}
                expected_candidate_version: {type: integer, minimum: 1}
      responses:
        '200': {description: 已确认模板，使用统一成功信封}
components:
  schemas:
    CreateInteractivePresentationRequest:
      type: object
      additionalProperties: false
      required: [audience]
      properties:
        style_profile_id:
          type: [string, 'null']
          format: uuid
          description: 可选历史风格画像；省略时按 visual_direction 创建已审计系统风格快照
        mode:
          type: string
          enum: [strict, balanced, brand_only]
          default: balanced
        audience: {type: string, minLength: 1, maxLength: 64}
        language:
          type: string
          enum: [zh-CN, en-US]
          default: zh-CN
        visual_direction:
          type: string
          minLength: 2
          maxLength: 200
          default: 暖白咨询、编辑部式商业叙事
  parameters:
    StyleProfileId:
      name: style_profile_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
