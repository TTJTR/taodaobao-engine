openapi: 3.1.0
info:
  title: 淘到宝引擎 V1 增量契约
  version: 1.1.0
  description: >-
    本文件只描述相对冻结 V0.5 openapi.yaml 新增的接口；冻结路径和字段语义保持不变。
servers:
  - url: /api/v1
paths:
  /auth/invitation/status:
    get:
      operationId: getInvitationStatus
      description: >-
        Returns only whether the deployment requires an invitation before
        Feishu OAuth. It never exposes invitation codes, signing secrets,
        redemption counts, or token policy internals.
      responses:
        '200':
          description: 邀请码门禁状态
          content:
            application/json:
              schema:
                type: object
                required: [request_id, data]
                properties:
                  request_id: {type: string}
                  data:
                    type: object
                    required: [required]
                    properties:
                      required: {type: boolean}
  /auth/invitation/verify:
    post:
      operationId: verifyInvitation
      description: >-
        Verifies either a server-registered short code in the tdb-xxxxx format
        or a backward-compatible signed invitation. Registered codes and new
        signed tokens may declare 1-100 total redemptions; legacy tokens default
        to one. Every successful redemption still creates a distinct,
        short-lived, single-use OAuth proof.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_code]
              properties:
                invitation_code: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200': {description: 签名邀请码验证成功、令牌摘要完成服务端登记，并为当前使用者建立限时且单次使用的 HttpOnly Cookie}
        '401': {description: 邀请码签名无效、已过期、超过最长有效期或共享兑换额度已用完；响应不会泄露具体原因或正确值}
  /feishu/resources:
    get:
      operationId: listFeishuResources
      parameters:
        - name: type
          in: query
          required: true
          schema: {enum: [document, minute]}
        - name: page_token
          in: query
          schema: {type: [string, 'null']}
      responses:
        '200': {description: 当前用户有权限访问的飞书文档或妙记列表}
  /research-tasks:
    post:
      operationId: createResearchTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateResearchTaskRequest'}
      responses:
        '202': {$ref: '#/components/responses/ResearchTaskResponse'}
    get:
      operationId: listResearchTasks
      responses:
        '200': {description: 当前工作区可访问的研究任务分页列表}
  /research-tasks/{task_id}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      operationId: getResearchTask
      responses:
        '200': {$ref: '#/components/responses/ResearchTaskResponse'}
  /research-tasks/{task_id}/context:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      operationId: getResearchContext
      responses:
        '200': {description: 两个专家协作入口共用的完整研究上下文包}
  /research-tasks/{task_id}/cancel:
    parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: cancelResearchTask
      responses:
        '200': {$ref: '#/components/responses/ResearchTaskResponse'}
  /research-tasks/{task_id}/retry:
    parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: retryResearchTask
      responses:
        '202': {$ref: '#/components/responses/ResearchTaskResponse'}
  /expert-collaborations:
    post:
      operationId: createExpertCollaboration
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [research_task_id]
              properties:
                research_task_id: {type: string, format: uuid}
      responses:
        '201': {$ref: '#/components/responses/ExpertCollaborationResponse'}
    get:
      operationId: listExpertCollaborations
      responses:
        '200': {description: 当前工作区专家协作分页列表}
  /expert-collaborations/{collaboration_id}:
    parameters: [{$ref: '#/components/parameters/CollaborationId'}]
    get:
      operationId: getExpertCollaboration
      responses:
        '200': {$ref: '#/components/responses/ExpertCollaborationResponse'}
    patch:
      operationId: updateExpertCollaboration
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateExpertCollaborationRequest'}
      responses:
        '200': {$ref: '#/components/responses/ExpertCollaborationResponse'}
  /expert-collaborations/{collaboration_id}/confirm:
    parameters: [{$ref: '#/components/parameters/CollaborationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: confirmExpertCollaboration
      responses:
        '200': {$ref: '#/components/responses/ExpertCollaborationResponse'}
  /expert-collaborations/events/replies:
    post:
      operationId: receiveExpertReply
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpertReplyEvent'}
      responses:
        '202': {description: 去重保存回复并恢复原研究任务}
  /expert-collaborations/events/feishu:
    post:
      operationId: receiveNativeFeishuEvent
      description: >-
        飞书开放平台原生事件回调。支持 url_verification challenge、加密事件、
        X-Lark-Signature 校验及 im.message.receive_v1 群文本消息；此入口无需业务登录态。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: challenge 响应、忽略非目标事件或接收成功}
        '401': {description: verification token、签名或加密数据校验失败}
  /expert-collaborations/replies/{reply_id}/adopt:
    parameters:
      - {name: reply_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: adoptExpertReply
      responses:
        '200': {description: 创建 pending_review 经验草稿，绝不自动校验}
  /sources/{source_id}:
    parameters:
      - {name: source_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: deleteSource
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: 软删除来源并立即暂停关联资产召回}
  /solution-runs/{run_id}/trust-report:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      operationId: getSolutionTrustReport
      responses:
        '200': {description: 返回版本化 Claim、Evidence、核验标签和后端最终 TrustDecision}
  /solution-runs/{run_id}/trust-review:
    parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: reviewSolutionTrust
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrustReviewRequest'}
      responses:
        '200': {description: 带乐观锁与完整审计记录的人工可信决策}
        '409': {description: 决策版本冲突或仍存在不可批准的高风险主张}
  /solution-runs/{run_id}/retry:
    parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: retrySolutionRun
      responses:
        '202': {description: 复用原运行并创建新 candidate version，不重复写用户消息}
  /presentation-references:
    post:
      operationId: createPresentationReference
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReferenceDeckRequest'}
      responses:
        '202': {description: 创建持久化安全解析任务；返回 ReferenceDeck}
  /presentation-references/{deck_id}:
    parameters: [{$ref: '#/components/parameters/DeckId'}]
    get:
      operationId: getPresentationReference
      responses:
        '200': {description: ReferenceDeck 版本、解析状态与安全报告}
  /style-profiles/generate:
    post:
      operationId: generateStyleProfile
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateStyleProfileRequest'}
      responses:
        '202': {description: 创建 draft 风格画像任务}
  /style-profiles/{profile_id}:
    parameters: [{$ref: '#/components/parameters/StyleProfileId'}]
    get:
      operationId: getStyleProfile
      responses:
        '200': {description: 返回风格画像版本、生成状态、视觉与叙事规则及冲突说明}
    patch:
      operationId: updateStyleProfile
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: 按 expected_version 更新视觉、叙事与冲突处理结果}
  /style-profiles/{profile_id}/confirm:
    parameters: [{$ref: '#/components/parameters/StyleProfileId'}]
    post:
      operationId: confirmStyleProfile
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: 人工确认后允许跨任务复用}
  /solution-runs/{run_id}/presentations:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      operationId: createPresentation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePresentationRequest'}
      responses:
        '202': {description: 仅为 RELEASE/DOWNGRADE 方案创建持久化演示任务}
        '409': {description: 上游未发布或风格画像未确认}
  /presentations/{presentation_id}:
    parameters: [{$ref: '#/components/parameters/PresentationId'}]
    get:
      operationId: getPresentation
      responses:
        '200': {description: 演示状态、Spec、最新 HTML Artifact 与上游可信版本}
  /presentations/{presentation_id}/blocks/{block_id}:
    parameters:
      - {$ref: '#/components/parameters/PresentationId'}
      - {name: block_id, in: path, required: true, schema: {type: string}}
    patch:
      operationId: updatePresentationBlock
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: 局部编辑形成新版本；无 released claim 的事实转 needs_claim_review}
  /presentations/{presentation_id}/regenerate:
    parameters: [{$ref: '#/components/parameters/PresentationId'}]
    post:
      operationId: regeneratePresentation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: 仅重生成未锁定区块}
  /presentations/{presentation_id}/export:
    parameters: [{$ref: '#/components/parameters/PresentationId'}]
    post:
      operationId: exportPresentation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: 复用 ready HtmlArtifact，只执行导出步骤}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CollaborationId:
      name: collaboration_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeckId:
      name: deck_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    StyleProfileId:
      name: profile_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PresentationId:
      name: presentation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    TrustReviewRequest:
      type: object
      required: [expected_decision_version, decision, reason]
      properties:
        expected_decision_version: {type: integer, minimum: 1}
        decision: {enum: [approve, downgrade, reject, revise]}
        reason: {type: string, minLength: 3, maxLength: 4000}
        edits: {type: object}
        evidence_changes: {type: array, items: {type: object}, maxItems: 100}
    CreateReferenceDeckRequest:
      type: object
      required: [file_id, title, storage_key, file_hash, mime_type, size_bytes]
      properties:
        file_id: {type: string, maxLength: 256}
        title: {type: string, maxLength: 300}
        storage_key: {type: string, maxLength: 1000}
        file_hash: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
        mime_type: {const: application/vnd.openxmlformats-officedocument.presentationml.presentation}
        size_bytes: {type: integer, minimum: 1, maximum: 104857600}
        source_url: {type: [string, 'null'], maxLength: 2000}
    GenerateStyleProfileRequest:
      type: object
      required: [name, reference_deck_ids]
      properties:
        name: {type: string, maxLength: 300}
        reference_deck_ids:
          type: array
          minItems: 1
          maxItems: 5
          items: {type: string, format: uuid}
    CreatePresentationRequest:
      type: object
      required: [style_profile_id, audience]
      properties:
        style_profile_id: {type: string, format: uuid}
        mode: {enum: [strict, balanced, brand_only], default: balanced}
        audience: {type: string, maxLength: 64}
        output: {type: array, items: {enum: [html, pdf]}, default: [html]}
        language: {enum: [zh-CN, en-US], default: zh-CN}
    CreateResearchTaskRequest:
      type: object
      required: [customer_profile_id, question]
      properties:
        customer_profile_id: {type: string, format: uuid}
        session_id: {type: [string, 'null'], format: uuid}
        title: {type: [string, 'null'], maxLength: 200}
        question: {type: string, minLength: 1, maxLength: 10000}
        completion_conditions: {type: array, maxItems: 8, items: {type: string}}
        intelligence_snapshot_id: {type: [string, 'null'], format: uuid}
        response_matrix_id: {type: [string, 'null'], format: uuid}
    ResearchTask:
      type: object
      required: [id, customer_profile_id, title, question, status, stage, progress, trace_id]
      properties:
        id: {type: string, format: uuid}
        customer_profile_id: {type: string, format: uuid}
        title: {type: string}
        question: {type: string}
        status:
          enum: [queued, planning, researching, waiting_expert, synthesizing, completed, failed, cancelled]
        stage: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        trace_id: {type: string}
        evidence_snapshot: {type: [object, 'null']}
        knowledge_gaps: {type: array, items: {type: string}}
        expert_questions: {type: array, items: {type: object}}
        report: {type: [object, 'null']}
    UpdateExpertCollaborationRequest:
      type: object
      required: [group_name, selected_expert_ids, questions]
      properties:
        group_name: {type: string, minLength: 1, maxLength: 200}
        selected_expert_ids: {type: array, minItems: 1, maxItems: 3, items: {type: string, format: uuid}}
        questions: {type: array, minItems: 1, maxItems: 8, items: {type: object}}
    ExpertReplyEvent:
      type: object
      required: [collaboration_id, question_id, author_id, author_name, answer_text, feishu_message_id, message_url]
      properties:
        collaboration_id: {type: string, format: uuid}
        question_id: {type: string}
        author_id: {type: string}
        author_name: {type: string}
        answer_text: {type: string}
        feishu_message_id: {type: string}
        message_url: {type: string}
        verification_token: {type: [string, 'null']}
  responses:
    ResearchTaskResponse:
      description: 研究任务响应信封
      content:
        application/json:
          schema:
            type: object
            properties:
              request_id: {type: string}
              data: {$ref: '#/components/schemas/ResearchTask'}
    ExpertCollaborationResponse:
      description: 专家协作响应信封
