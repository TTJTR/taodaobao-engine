openapi: 3.1.0
info:
  title: 淘到宝引擎 V2 增量契约
  version: 2.0.0
  description: >-
    本文件仅冻结相对 V0.5 openapi.yaml 与 V1 增量契约新增的接口。
    原有路径、字段语义、状态枚举及 AIEngine 五个方法均保持不变。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /intelligence/raw-artifacts/{artifact_id}/enrich:
    post:
      operationId: enrichRawArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrichRawArtifactRequest'}
      responses: {'201': {$ref: '#/components/responses/ItemResponse'}}
  /runtime/tasks:
    get:
      operationId: listRuntimeTasks
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: task_type, in: query, schema: {enum: [quick_solution, deep_research, presentation, intelligence, rehearsal]}}
        - {name: status, in: query, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/ListResponse'}}
  /runtime/tasks/{task_id}:
    get:
      operationId: getRuntimeTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /runtime/tasks/{task_id}/steps:
    get:
      operationId: listRuntimeTaskSteps
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses: {'200': {$ref: '#/components/responses/ListResponse'}}
  /model-connections:
    get:
      operationId: listModelConnections
      responses: {'200': {$ref: '#/components/responses/ListResponse'}}
  /model-connections/{provider}/test:
    post:
      operationId: testModelConnection
      parameters:
        - {name: provider, in: path, required: true, schema: {enum: [ai, deep-research, presentation, worker, feishu]}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}, '503': {$ref: '#/components/responses/ErrorResponse'}}
  /intelligence/search-runs:
    post:
      operationId: createSearchRun
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateSearchRun'}
      responses: {'201': {$ref: '#/components/responses/ItemResponse'}}
    get:
      operationId: listSearchRuns
      responses: {'200': {$ref: '#/components/responses/ListResponse'}}
  /intelligence/search-runs/{run_id}:
    get:
      operationId: getSearchRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /intelligence/items:
    get:
      operationId: listIntelligenceItems
      parameters:
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
      responses: {'200': {$ref: '#/components/responses/ListResponse'}}
  /intelligence/items/{item_id}:
    get:
      operationId: getIntelligenceItem
      parameters: [{$ref: '#/components/parameters/ItemId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /intelligence/snapshots:
    post:
      operationId: createIntelligenceSnapshot
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIntelligenceSnapshotRequest'}
      responses: {'201': {$ref: '#/components/responses/ItemResponse'}}
  /intelligence/snapshots/{snapshot_id}:
    get:
      operationId: getIntelligenceSnapshot
      parameters: [{$ref: '#/components/parameters/SnapshotId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /customer-profiles/{profile_id}/intelligence-proposals:
    post:
      operationId: createProfileIntelligenceProposal
      parameters: [{$ref: '#/components/parameters/ProfileId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProfileProposalRequest'}
      responses: {'201': {$ref: '#/components/responses/ItemResponse'}}
  /customer-profiles/{profile_id}/intelligence-proposals/{proposal_id}/confirm:
    post:
      operationId: confirmProfileIntelligenceProposal
      parameters: [{$ref: '#/components/parameters/ProfileId'}, {$ref: '#/components/parameters/ProposalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /customer-profiles/{profile_id}/intelligence-proposals/{proposal_id}/reject:
    post:
      operationId: rejectProfileIntelligenceProposal
      parameters: [{$ref: '#/components/parameters/ProfileId'}, {$ref: '#/components/parameters/ProposalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /tenders:
    post:
      operationId: createTender
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTenderRequest'}
      responses: {'201': {$ref: '#/components/responses/ItemResponse'}}
    get:
      operationId: listTenders
      responses: {'200': {$ref: '#/components/responses/ListResponse'}}
  /tenders/{tender_id}:
    get:
      operationId: getTender
      parameters: [{$ref: '#/components/parameters/TenderId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /tenders/{tender_id}/requirements:
    get:
      operationId: listTenderRequirements
      parameters: [{$ref: '#/components/parameters/TenderId'}]
      responses: {'200': {$ref: '#/components/responses/TenderRequirementListResponse'}}
  /tenders/{tender_id}/response-matrices:
    post:
      operationId: createResponseMatrix
      parameters: [{$ref: '#/components/parameters/TenderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateResponseMatrixRequest'}
      responses: {'201': {$ref: '#/components/responses/ItemResponse'}}
  /response-matrices/{matrix_id}:
    get:
      operationId: getResponseMatrix
      parameters: [{$ref: '#/components/parameters/MatrixId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /response-matrices/{matrix_id}/items/{item_id}:
    patch:
      operationId: updateResponseMatrixItem
      parameters: [{$ref: '#/components/parameters/MatrixId'}, {$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateResponseItemRequest'}
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /response-matrices/{matrix_id}/items/{item_id}/review:
    post:
      operationId: reviewResponseMatrixItem
      parameters: [{$ref: '#/components/parameters/MatrixId'}, {$ref: '#/components/parameters/ItemId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewResponseItemRequest'}
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /rehearsals:
    post:
      operationId: createRehearsal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRehearsalRequest'}
      responses: {'201': {$ref: '#/components/responses/ItemResponse'}}
    get:
      operationId: listRehearsals
      responses: {'200': {$ref: '#/components/responses/ListResponse'}}
  /rehearsals/{rehearsal_id}:
    get:
      operationId: getRehearsal
      parameters: [{$ref: '#/components/parameters/RehearsalId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /rehearsals/{rehearsal_id}/start:
    post:
      operationId: startRehearsal
      parameters: [{$ref: '#/components/parameters/RehearsalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /rehearsals/{rehearsal_id}/turns:
    post:
      operationId: submitRehearsalTurn
      parameters: [{$ref: '#/components/parameters/RehearsalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties: {answer: {type: string, minLength: 1, maxLength: 20000}}
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /rehearsals/{rehearsal_id}/complete:
    post:
      operationId: completeRehearsal
      parameters: [{$ref: '#/components/parameters/RehearsalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
  /rehearsals/{rehearsal_id}/report:
    get:
      operationId: getRehearsalReport
      parameters: [{$ref: '#/components/parameters/RehearsalId'}]
      responses: {'200': {$ref: '#/components/responses/ItemResponse'}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: taodaobao_session}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    TaskId: {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
    RunId: {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
    ItemId: {name: item_id, in: path, required: true, schema: {type: string, format: uuid}}
    SnapshotId: {name: snapshot_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProfileId: {name: profile_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProposalId: {name: proposal_id, in: path, required: true, schema: {type: string, format: uuid}}
    TenderId: {name: tender_id, in: path, required: true, schema: {type: string, format: uuid}}
    MatrixId: {name: matrix_id, in: path, required: true, schema: {type: string, format: uuid}}
    RehearsalId: {name: rehearsal_id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    EnrichRawArtifactRequest:
      type: object
      additionalProperties: false
      required: [profile_id]
      properties:
        profile_id: {type: string, format: uuid}
    RawArtifactKind:
      type: string
      enum: [web_page, tender_file, pasted_text]
    RawArtifactStatus:
      type: string
      enum: [captured, partial, validated, rejected, unavailable]
    RawArtifact:
      type: object
      additionalProperties: false
      required: [id, artifact_key, kind, status, provider, content_sha256, byte_size, captured_at]
      properties:
        id: {type: string, format: uuid}
        search_run_id: {type: [string, 'null'], format: uuid}
        artifact_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        kind: {$ref: '#/components/schemas/RawArtifactKind'}
        status: {$ref: '#/components/schemas/RawArtifactStatus'}
        provider: {type: string, maxLength: 64}
        source_url: {type: [string, 'null'], format: uri, maxLength: 2000}
        normalized_url: {type: [string, 'null'], format: uri, maxLength: 2000}
        source_filename: {type: [string, 'null'], maxLength: 500}
        mime_type: {type: [string, 'null'], maxLength: 128}
        http_status: {type: [integer, 'null'], minimum: 100, maximum: 599}
        content_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        byte_size: {type: integer, minimum: 0}
        storage_uri: {type: [string, 'null'], maxLength: 2000}
        published_at: {type: [string, 'null'], format: date-time}
        captured_at: {type: string, format: date-time}
        security_report: {type: object, additionalProperties: true}
        metadata_snapshot: {type: object, additionalProperties: true}
        error_code: {type: [string, 'null'], maxLength: 64}
    DocumentLocation:
      oneOf:
        - {$ref: '#/components/schemas/PdfDocumentLocation'}
        - {$ref: '#/components/schemas/DocxDocumentLocation'}
        - {$ref: '#/components/schemas/XlsxDocumentLocation'}
        - {$ref: '#/components/schemas/PptxDocumentLocation'}
        - {$ref: '#/components/schemas/PlainTextDocumentLocation'}
      discriminator:
        propertyName: kind
        mapping:
          pdf_page: '#/components/schemas/PdfDocumentLocation'
          docx_paragraph: '#/components/schemas/DocxDocumentLocation'
          xlsx_cell: '#/components/schemas/XlsxDocumentLocation'
          pptx_shape: '#/components/schemas/PptxDocumentLocation'
          plain_text: '#/components/schemas/PlainTextDocumentLocation'
    DocumentLocationBase:
      type: object
      required: [kind, schema_version, quote_hash]
      properties:
        kind: {type: string}
        schema_version: {const: document-location-v1}
        quote_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        section_path:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 500}
    PdfDocumentLocation:
      allOf:
        - {$ref: '#/components/schemas/DocumentLocationBase'}
        - type: object
          required: [page]
          properties:
            kind: {const: pdf_page}
            page: {type: integer, minimum: 1}
            bounding_box:
              type: [array, 'null']
              minItems: 4
              maxItems: 4
              items: {type: number, minimum: 0}
    DocxDocumentLocation:
      allOf:
        - {$ref: '#/components/schemas/DocumentLocationBase'}
        - type: object
          required: [paragraph_index]
          properties:
            kind: {const: docx_paragraph}
            paragraph_index: {type: integer, minimum: 0}
            table_index: {type: [integer, 'null'], minimum: 0}
            row_index: {type: [integer, 'null'], minimum: 0}
            column_index: {type: [integer, 'null'], minimum: 0}
    XlsxDocumentLocation:
      allOf:
        - {$ref: '#/components/schemas/DocumentLocationBase'}
        - type: object
          required: [sheet, cell_range]
          properties:
            kind: {const: xlsx_cell}
            sheet: {type: string, minLength: 1, maxLength: 31}
            cell_range: {type: string, minLength: 1, maxLength: 64}
    PptxDocumentLocation:
      allOf:
        - {$ref: '#/components/schemas/DocumentLocationBase'}
        - type: object
          required: [slide, shape_id]
          properties:
            kind: {const: pptx_shape}
            slide: {type: integer, minimum: 1}
            shape_id: {type: string, minLength: 1, maxLength: 128}
    PlainTextDocumentLocation:
      allOf:
        - {$ref: '#/components/schemas/DocumentLocationBase'}
        - type: object
          required: [start_offset, end_offset]
          properties:
            kind: {const: plain_text}
            start_offset: {type: integer, minimum: 0}
            end_offset: {type: integer, minimum: 1}
    TenderParseVersion:
      type: object
      additionalProperties: false
      required: [id, tender_id, raw_artifact_id, version, parser_name, parser_version, document_schema_version, status]
      properties:
        id: {type: string, format: uuid}
        tender_id: {type: string, format: uuid}
        raw_artifact_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        parser_name: {type: string, maxLength: 128}
        parser_version: {type: string, maxLength: 128}
        document_schema_version: {type: string, maxLength: 32}
        status: {enum: [queued, parsing, parsed, failed, rejected]}
        resource_usage: {type: object, additionalProperties: true}
        error_code: {type: [string, 'null'], maxLength: 64}
    TenderRequirement:
      type: object
      additionalProperties: false
      required: [id, tender_id, sequence, version, requirement_text, category, mandatory, source_location, status]
      properties:
        id: {type: string, format: uuid}
        tender_id: {type: string, format: uuid}
        parse_version_id: {type: [string, 'null'], format: uuid}
        sequence: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1}
        requirement_text: {type: string, minLength: 1}
        category: {type: string, maxLength: 64}
        mandatory: {type: boolean}
        acceptance_condition: {type: [string, 'null']}
        constraints: {type: object, additionalProperties: true}
        ambiguities: {type: array, items: {type: string}}
        source_location: {$ref: '#/components/schemas/DocumentLocation'}
        status: {enum: [ai_draft, edited, confirmed, rejected, superseded]}
        confirmed_by_id: {type: [string, 'null'], format: uuid}
        confirmed_at: {type: [string, 'null'], format: date-time}
    TenderRequirementVersion:
      type: object
      additionalProperties: false
      required: [id, requirement_id, version, change_type, requirement_snapshot, source_location]
      properties:
        id: {type: string, format: uuid}
        requirement_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        changed_by_id: {type: [string, 'null'], format: uuid}
        change_type: {enum: [created, migrated, edited, merged, split, confirmed, rejected, superseded]}
        requirement_snapshot: {type: object, additionalProperties: true}
        source_location: {$ref: '#/components/schemas/DocumentLocation'}
    ManualIntelligenceSource:
      type: object
      required: [title, source_url, content]
      properties:
        title: {type: string, maxLength: 500}
        source_url: {type: string, format: uri}
        content: {type: string, maxLength: 200000}
        published_at: {type: [string, 'null'], format: date-time}
    CreateSearchRunRequest:
      type: object
      required: [query, purpose, sources]
      properties:
        query: {type: string, maxLength: 2000}
        purpose: {enum: [customer_profile, solution, tender]}
        provider: {const: manual, default: manual}
        sources: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/ManualIntelligenceSource'}}
    CreateIntelligenceSnapshotRequest:
      type: object
      required: [purpose, item_ids]
      properties:
        purpose: {enum: [customer_profile, solution, tender]}
        item_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
    CreateProfileProposalRequest:
      type: object
      required: [snapshot_id, proposed_patch]
      properties:
        snapshot_id: {type: string, format: uuid}
        proposed_patch: {type: object, minProperties: 1}
    CreateTenderRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 500}
        customer_profile_id: {type: [string, 'null'], format: uuid}
        pasted_text: {type: [string, 'null'], maxLength: 1000000}
        source_filename: {type: [string, 'null'], maxLength: 500}
        source_mime_type: {type: [string, 'null'], maxLength: 128}
        content_base64: {type: [string, 'null'], maxLength: 8000000}
      anyOf: [{required: [pasted_text]}, {required: [content_base64]}]
    CreateResponseMatrixRequest:
      type: object
      properties:
        experience_ids: {type: array, maxItems: 100, items: {type: string, format: uuid}}
        capability_ids: {type: array, maxItems: 100, items: {type: string, format: uuid}}
        intelligence_snapshot_id: {type: [string, 'null'], format: uuid}
    UpdateResponseItemRequest:
      type: object
      properties:
        response_text: {type: [string, 'null'], maxLength: 20000}
        risks: {type: [array, 'null'], maxItems: 20, items: {type: string}}
    ReviewResponseItemRequest:
      type: object
      required: [action]
      properties:
        action: {enum: [accept, reject, needs_revision]}
        note: {type: [string, 'null'], maxLength: 1000}
    CreateRehearsalRequest:
      type: object
      required: [customer_profile_id, role]
      properties:
        customer_profile_id: {type: string, format: uuid}
        title: {type: [string, 'null'], maxLength: 300}
        solution_run_id: {type: [string, 'null'], format: uuid}
        research_task_id: {type: [string, 'null'], format: uuid}
        intelligence_snapshot_id: {type: [string, 'null'], format: uuid}
        response_matrix_id: {type: [string, 'null'], format: uuid}
        role: {enum: [customer_decision_maker, technical_reviewer, procurement, challenger]}
        difficulty: {enum: [easy, standard, hard], default: standard}
        focus_areas: {type: array, maxItems: 8, items: {type: string}}
        max_turns: {type: integer, minimum: 3, maximum: 10, default: 5}
      anyOf: [{required: [solution_run_id]}, {required: [research_task_id]}]
    SuccessEnvelope:
      type: object
      required: [request_id, data]
      properties: {request_id: {type: string}, data: {type: object, additionalProperties: true}}
    ErrorEnvelope:
      type: object
      required: [request_id, error]
      properties:
        request_id: {type: string}
        error:
          type: object
          required: [code, message, retryable, details]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            details: {type: object, additionalProperties: true}
  requestBodies:
    CreateSearchRun:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateSearchRunRequest'}
  responses:
    ItemResponse:
      description: 成功
      content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}
    ListResponse:
      description: 成功，data 包含 items 与分页字段
      content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}
    TenderRequirementListResponse:
      description: 招标要求列表，所有要求包含可校验的原文位置
      content:
        application/json:
          schema:
            type: object
            required: [request_id, data]
            properties:
              request_id: {type: string}
              data:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TenderRequirement'}
                  page: {type: integer, minimum: 1}
                  page_size: {type: integer, minimum: 1, maximum: 100}
                  has_more: {type: boolean}
    ErrorResponse:
      description: 失败
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
