<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 情报工作台</title><link rel="stylesheet" href="/v2-workbench.css"></head><body><div class="shell"><header class="top"><div class="brand">淘到宝引擎 · V2</div><nav><a href="/">首页</a><a class="active" href="/v2_intelligence.html">情报工作台</a><a href="/v2_tender.html">招标工作台</a></nav><div class="status" id="status">连接中</div></header><main class="layout"><aside class="column"><div class="section-head"><h2>搜索任务</h2><p>按任务审阅来源与事实</p></div><div class="list" id="runs"></div></aside><section class="column"><div class="section-head"><h1>客户情报</h1><p id="summary">加载结构化事实与冲突组</p></div><div class="toolbar"><select id="profile"></select><select id="filter"><option value="all">全部事实</option><option value="conflict">仅冲突</option></select></div><div class="list" id="items"></div></section><aside class="column"><div class="section-head"><h2>Trust Gate</h2><p>冲突对比与画像提议审批</p></div><div class="detail" id="detail"></div></aside></main></div><script type="module">
import{apiFetch,esc,notice}from"/v2-workbench.js";const state={runs:[],items:[],profiles:[],selectedRun:null,selectedItem:null,proposals:[]};const $=id=>document.getElementById(id);async function load(){try{await apiFetch("/me");const[runs,profiles]=await Promise.all([apiFetch("/intelligence/search-runs?page=1&page_size=100"),apiFetch("/customer-profiles?page=1&page_size=100")]);state.runs=runs.items||[];state.profiles=profiles.items||[];state.selectedRun=state.runs[0]?.id;$('profile').innerHTML=state.profiles.map(p=>`<option value="${p.id}">${esc(p.customer_name)}</option>`).join("");renderRuns();await loadItems();$('status').textContent="已连接"}catch(e){$('status').textContent="需要登录";notice(e.message,true)}}async function loadItems(){const query=state.selectedRun?`?run_id=${state.selectedRun}&page=1&page_size=100`:"?page=1&page_size=100";const data=await apiFetch(`/intelligence/items${query}`);state.items=data.items||[];const profileId=$('profile').value;if(profileId){const p=await apiFetch(`/customer-profiles/${profileId}/intelligence-proposals?status=pending_confirmation&page_size=100`);state.proposals=p.items||[]}renderItems();renderDetail()}function renderRuns(){$('runs').innerHTML=state.runs.map(r=>`<button class="row ${r.id===state.selectedRun?'active':''}" data-run="${r.id}"><strong>${esc(r.query)}</strong><div class="meta"><span class="badge green">${esc(r.status)}</span><span>${esc(r.provider)}</span></div></button>`).join("")||'<div class="empty">暂无搜索任务</div>'}function renderItems(){const conflictOnly=$('filter').value==='conflict';const rows=state.items.filter(i=>!conflictOnly||i.conflict_group_id);$('summary').textContent=`${rows.length} 条事实 · ${new Set(rows.filter(i=>i.conflict_group_id).map(i=>i.conflict_group_id)).size} 个冲突组`;$('items').innerHTML=rows.map(i=>{const f=i.facts?.[0]||{};return`<button class="row ${i.conflict_group_id?'conflict':''} ${i.id===state.selectedItem?'active':''}" data-item="${i.id}"><strong>${esc(i.title)}</strong><div class="fact">${esc(f.field||'事实')}：${esc(f.value||i.summary)}</div><a class="source" href="${esc(i.source_url)}" target="_blank">${esc(i.source_domain)}</a><div class="meta"><span class="badge ${i.conflict_group_id?'red':'green'}">${i.conflict_group_id?'来源冲突':'已溯源'}</span><span>置信度 ${Math.round((i.metadata_snapshot?.confidence||0)*100)}%</span></div></button>`}).join("")||'<div class="empty">当前筛选没有情报</div>'}function renderDetail(){const item=state.items.find(i=>i.id===state.selectedItem)||state.items.find(i=>i.conflict_group_id);const proposal=state.proposals[0];let html='<h3>冲突对比</h3>';if(item?.conflict_group_id){const peers=state.items.filter(i=>i.conflict_group_id===item.conflict_group_id);html+=`<div class="compare">${peers.map(p=>`<div class="candidate"><strong>${esc(p.facts?.[0]?.value||p.title)}</strong><div class="meta">${esc(p.source_domain)} · ${Math.round((p.metadata_snapshot?.confidence||0)*100)}%</div></div>`).join('')}</div>`}else html+='<div class="empty">选择冲突事实查看来源差异</div>';html+='<h3>待审批画像提议</h3>';if(proposal){html+=Object.entries(proposal.proposed_patch).map(([field,value])=>`<div class="patch"><strong>${esc(field)}</strong><span>${esc(value.resolution_required?'需人工选择冲突候选':JSON.stringify(value.proposed??value))}</span></div>`).join('');html+=`<div class="actions"><button class="primary" data-decision="confirm" data-id="${proposal.id}">确认提议</button><button class="danger" data-decision="reject" data-id="${proposal.id}">拒绝</button></div>`}else html+='<div class="empty">没有 pending Proposal</div>';$('detail').innerHTML=html}document.addEventListener('click',async e=>{const run=e.target.closest('[data-run]');if(run){state.selectedRun=run.dataset.run;renderRuns();await loadItems()}const item=e.target.closest('[data-item]');if(item){state.selectedItem=item.dataset.item;renderItems();renderDetail()}const decision=e.target.closest('[data-decision]');if(decision){try{const profileId=$('profile').value,proposal=state.proposals.find(p=>p.id===decision.dataset.id),selected_candidates={};if(decision.dataset.decision==='confirm')Object.entries(proposal?.proposed_patch||{}).forEach(([field,value])=>{if(value.resolution_required&&value.candidates?.length)selected_candidates[field]=[...value.candidates].sort((a,b)=>(b.confidence||0)-(a.confidence||0))[0].intelligence_item_id});await apiFetch(`/customer-profiles/${profileId}/intelligence-proposals/${decision.dataset.id}/${decision.dataset.decision}`,{method:'POST',body:{note:'V2 工作台人工审批',selected_candidates}});notice('画像提议已处理');await loadItems()}catch(err){notice(err.message,true)}}});$('profile').addEventListener('change',loadItems);$('filter').addEventListener('change',renderItems);load();
</script></body></html>
