        return sources.find(source=>source.id===accepted.target_id)||{id:accepted.target_id,title:payload.title||"新导入资料",type:payload.type||"待识别",author:"当前用户",updated:"刚刚",synced:"刚刚",status:"待校验",freshness:"原文最新",tags:[],purpose:payload.purpose||"经验提取",summary:"资料处理完成，等待人工校验。"};
      },
      async buildProfile(text){
        const customerName=`新客户 ${new Date().toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
        const profile=await apiFetch("/customer-profiles",{method:"POST",body:{customer_name:customerName}});
        await apiFetch(`/customer-profiles/${profile.id}/generate`,{method:"POST",body:{source_ids:[],supplemental_text:text}});
        return mapProfile(await apiFetch(`/customer-profiles/${profile.id}`));
      },
      async confirmProfile(id){await apiFetch(`/customer-profiles/${id}/confirm`,{method:"POST"})},
      async reviewExperience(id,action,data){if(data)await apiFetch(`/experiences/${id}`,{method:"PATCH",body:data});return mapExperience(await apiFetch(`/experiences/${id}/review`,{method:"POST",body:{action}}))},
      async reviewCapability(id,action,data){if(data)await apiFetch(`/capabilities/${id}`,{method:"PATCH",body:data});return mapCapability(await apiFetch(`/capabilities/${id}/review`,{method:"POST",body:{action}}))},
      async quickSearch(query,sessionId){
        const accepted=await apiFetch(`/sessions/${sessionId}/turns`,{method:"POST",body:{content:query,mode:"quick"}});
        while(true){
          const run=await apiFetch(`/solution-runs/${accepted.run_id}`);
          if(run.status==="completed"){
            const snapshot=run.retrieval_snapshot||{experiences:[],capabilities:[]};
            return{query,unsupported:false,solution:run.result,experiences:snapshot.experiences.map(mapExperience),capabilities:snapshot.capabilities.map(mapCapability),generatedAt:new Date(run.completed_at||Date.now()).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})};
          }
          if(run.status==="failed")throw new Error(run.error_code||"方案生成失败");
          await delay(1000);
        }
      }
    };

    const CalmPet={
      el:null,hoverTimer:null,strikeTimer:null,startedAt:0,count:0,audio:null,drag:null,speeds:[1200,950,740,580,450,360],
      init(){this.el=$("#calm-pet");if(!this.el)return;this.load();this.updateScore();this.el.addEventListener("pointerenter",event=>{if(event.pointerType!=="touch"&&!this.drag)this.arm()});this.el.addEventListener("pointerleave",()=>{if(!this.drag)this.stop()});this.el.addEventListener("pointerdown",event=>this.beginDrag(event));this.el.addEventListener("pointermove",event=>this.moveDrag(event));this.el.addEventListener("pointerup",event=>this.endDrag(event));this.el.addEventListener("pointercancel",event=>this.endDrag(event));document.addEventListener("pointerdown",()=>this.unlockAudio(),{passive:true});window.addEventListener("resize",()=>this.keepInViewport())},
      load(){try{const saved=JSON.parse(localStorage.getItem(CONFIG.petStorageKey)||"{}");this.count=Number.isFinite(saved.count)?saved.count:0;if(Number.isFinite(saved.left)&&Number.isFinite(saved.top)){this.el.style.left=`${saved.left}px`;this.el.style.top=`${saved.top}px`;this.el.style.right="auto";this.el.style.bottom="auto"}}catch{}},
      save(){try{const rect=this.el.getBoundingClientRect();localStorage.setItem(CONFIG.petStorageKey,JSON.stringify({count:this.count,left:rect.left,top:rect.top}))}catch{}},
      setVisible(show){if(!this.el)return;this.el.classList.toggle("visible",!!show);if(!show)this.stop();else requestAnimationFrame(()=>this.keepInViewport())},
      arm(){this.stop(false);this.setCopy("停留一下，准备静心","0.8秒后自动开始");this.hoverTimer=setTimeout(()=>this.start(),800)},
      start(){if(!Store.state?.loggedIn||this.drag)return;this.startedAt=Date.now();this.el.classList.add("active");this.strikeLoop()},
      strikeLoop(){if(!this.el.classList.contains("active"))return;const elapsed=Date.now()-this.startedAt,level=Math.min(Math.floor(elapsed/6000),this.speeds.length-1),interval=this.speeds[level];this.strike();this.setCopy(`静心进行中 · ${level+1}档`,`每${(interval/1000).toFixed(interval%1000?2:0)}秒一次，持续6秒后加速`);this.strikeTimer=setTimeout(()=>this.strikeLoop(),interval)},
      stop(resetCopy=true){clearTimeout(this.hoverTimer);clearTimeout(this.strikeTimer);this.hoverTimer=this.strikeTimer=null;this.el?.classList.remove("active");if(resetCopy)this.setCopy("悬停0.8秒，自动静心","持续悬停，每6秒加速一档")},
      strike(){this.count+=1;this.updateScore();this.el.classList.remove("strike");void this.el.offsetWidth;this.el.classList.add("strike");this.playSound();this.save()},
      updateScore(){const score=$("#calm-score");if(score)score.textContent=`功德 ${this.count}`},
      setCopy(title,status){const titleEl=$("#calm-title"),statusEl=$("#calm-status");if(titleEl)titleEl.textContent=title;if(statusEl)statusEl.textContent=status},
      unlockAudio(){try{const AudioEngine=window.AudioContext||window.webkitAudioContext;if(!AudioEngine)return;if(!this.audio)this.audio=new AudioEngine();if(this.audio.state==="suspended")this.audio.resume().catch(()=>{})}catch{}},
      playSound(){const ctx=this.audio;if(!ctx||ctx.state!=="running")return;try{const now=ctx.currentTime,gain=ctx.createGain(),filter=ctx.createBiquadFilter(),body=ctx.createOscillator(),tone=ctx.createOscillator();filter.type="lowpass";filter.frequency.setValueAtTime(950,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.11,now+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+.16);body.type="sine";body.frequency.setValueAtTime(235,now);body.frequency.exponentialRampToValueAtTime(145,now+.12);tone.type="triangle";tone.frequency.setValueAtTime(430,now);tone.frequency.exponentialRampToValueAtTime(220,now+.08);body.connect(filter);tone.connect(filter);filter.connect(gain);gain.connect(ctx.destination);body.start(now);tone.start(now);body.stop(now+.17);tone.stop(now+.12)}catch{}},
      beginDrag(event){if(event.button!==undefined&&event.button!==0)return;this.unlockAudio();this.stop();const rect=this.el.getBoundingClientRect();this.el.style.left=`${rect.left}px`;this.el.style.top=`${rect.top}px`;this.el.style.right="auto";this.el.style.bottom="auto";this.drag={pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,left:rect.left,top:rect.top,moved:false};this.el.classList.add("dragging");this.el.setPointerCapture?.(event.pointerId)},
      moveDrag(event){if(!this.drag||event.pointerId!==this.drag.pointerId)return;const dx=event.clientX-this.drag.startX,dy=event.clientY-this.drag.startY;if(Math.abs(dx)+Math.abs(dy)>4)this.drag.moved=true;const maxX=Math.max(8,window.innerWidth-this.el.offsetWidth-8),maxY=Math.max(8,window.innerHeight-this.el.offsetHeight-8);this.el.style.left=`${Math.min(maxX,Math.max(8,this.drag.left+dx))}px`;this.el.style.top=`${Math.min(maxY,Math.max(8,this.drag.top+dy))}px`},
      endDrag(event){if(!this.drag||event.pointerId!==this.drag.pointerId)return;this.el.releasePointerCapture?.(event.pointerId);this.drag=null;this.el.classList.remove("dragging");this.keepInViewport();this.save();if(event.pointerType==="mouse"&&this.el.matches(":hover"))this.arm()},
      keepInViewport(){if(!this.el?.classList.contains("visible"))return;const rect=this.el.getBoundingClientRect(),maxX=Math.max(8,window.innerWidth-rect.width-8),maxY=Math.max(8,window.innerHeight-rect.height-8),left=Math.min(maxX,Math.max(8,rect.left)),top=Math.min(maxY,Math.max(8,rect.top));this.el.style.left=`${left}px`;this.el.style.top=`${top}px`;this.el.style.right="auto";this.el.style.bottom="auto"}
    };

    function renderConversation(session,customer){return `${session.messages.filter(m=>!m.afterResult).map(m=>renderMessage(m)).join("")}${renderResult(session.result,customer)}<div class="stack" style="margin-top:14px">${session.messages.filter(m=>m.afterResult).map(m=>renderMessage(m)).join("")}</div><div class="follow-composer"><textarea id="follow-input" placeholder="继续追问方案依据、前置条件或风险……"></textarea><button class="button primary" data-action="send-follow">发送</button></div>`}
    function renderMessage(m){if(m.afterResult)return m.role==="user"?`<div class="message user"><div class="bubble"><p>${esc(m.text)}</p><small>我 · 刚刚</small></div><div class="msg-avatar person">林</div></div>`:`<div class="message"><div class="msg-avatar">AI</div><div class="bubble"><p>${esc(m.text)}</p><small>淘到宝引擎 · 基于当前会话</small></div></div>`;return m.role==="user"?`<div class="message user"><div class="bubble"><p>${esc(m.text)}</p><small>我 · ${esc(m.time||"刚刚")}</small></div><div class="msg-avatar person">林</div></div>`:""}
    function renderResult(result,customer){if(result.solution){const s=result.solution,itemList=items=>`<ul>${(items||[]).map(x=>`<li>${esc(x.text)} <span class="boundary">${esc(x.boundary)}</span></li>`).join("")||"<li>当前无已校验依据</li>"}</ul>`;return `<div class="result"><div class="result-hero"><div class="kicker">Aha Moment · 八区块快速方案</div><h2>基于客户画像与已校验企业资产生成</h2>${itemList(s.requirement_understanding)}</div><div class="result-grid"><div class="result-card recommendation"><h3>初步建议</h3>${itemList(s.initial_recommendations)}</div><div class="result-card"><h3>历史依据</h3>${itemList(s.historical_evidence)}</div><div class="result-card full"><h3>能力组合</h3>${itemList(s.capability_composition)}</div><div class="result-card risk-card"><h3>前置条件与风险</h3>${itemList(s.prerequisites_and_risks)}</div><div class="result-card"><h3>待确认信息</h3>${itemList(s.pending_confirmations)}</div><div class="result-card full"><h3>来源</h3><div class="source-tags">${(s.sources||[]).map(x=>`<span class="source-tag">${esc(x.type||"asset")} · ${esc(x.asset_id||"")}</span>`).join("")||"暂无已校验来源"}</div></div><div class="result-card full"><h3>建议追问</h3><ul>${(s.suggested_questions||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>`}if(result.unsupported)return `<div class="result"><div class="result-hero"><div class="kicker">Aha Moment · 能力边界已识别</div><h2>当前企业资料不足以支持“自动调整生产设备参数”</h2><p>已检索当前客户画像、已校验经验与原子能力，没有找到可用于生产控制的企业能力依据。</p><div class="boundary-row"><span class="boundary">历史事实：无匹配</span><span class="boundary">企业能力：无匹配</span><span class="boundary">AI推断：不作为企业承诺</span></div></div><div class="result-grid"><div class="result-card full"><div class="unsupported"><strong>当前知识库无匹配依据</strong><p>不得将该需求写成神州数码已有能力或正式解决方案。建议先确认客户是否接受“异常识别＋人工确认＋状态回写”的替代路径。</p></div></div><div class="result-card"><h3>AI探索建议<span>与企业能力分开</span></h3><p>可以探索将异常识别结果交由责任人确认，再通过既有接口回写状态，但这仍需产品和交付人员确认。</p></div><div class="result-card risk-card"><h3>建议追问</h3><ul><li>客户是否必须直接控制设备？</li><li>人工确认后回写是否可以接受？</li><li>现有系统是否提供受控写入接口？</li></ul></div></div></div>`;
      return `<div class="result"><div class="result-hero"><div class="kicker">Aha Moment · 快速方案</div><h2>先做“旁路接入＋单产线试点”，而不是替换现有系统</h2><p>客户真正的约束不是是否使用视觉检测，而是新增能力不能影响现有生产系统。建议先验证样本、识别效果与异常闭环，再决定推广范围。</p><div class="boundary-row"><span class="boundary">历史事实有来源</span><span class="boundary">企业能力已校验</span><span class="boundary">实施顺序属于AI推断</span><span class="boundary">3项信息待确认</span></div></div><div class="result-grid"><div class="result-card recommendation"><h3>首要建议<span>内部方案底稿</span></h3><p>以旁路方式接入现有摄像数据，在边缘节点完成缺陷识别，将异常转化为业务事件并交由现场人员确认。第一阶段只承诺单产线试点，不承诺直接全厂复制。</p></div><div class="result-card"><h3>需求理解</h3><ul><li>${esc(result.query)}</li><li>必须兼容客户现有系统。</li><li>试点周期和验收指标需要进一步明确。</li></ul></div><div class="result-card full"><h3>核心依据<span>按问题与约束优先排序</span></h3><div class="evidence-list">${result.experiences.slice(0,2).map(x=>`<div class="evidence-item"><span class="evidence-icon">验</span><div><b>${esc(x.name)}</b><p>${esc(x.solution)}｜适用条件：${esc(x.conditions)}</p></div><button data-action="open-experience" data-id="${x.id}">查看</button></div>`).join("")}</div></div><div class="result-card full"><h3>关键原子能力组合<span>${result.capabilities.length}项已校验能力参与</span></h3><div class="evidence-list">${result.capabilities.slice(0,4).map(x=>`<div class="evidence-item"><span class="evidence-icon cap">能</span><div><b>${esc(x.name)}</b><p>输入：${esc(x.input)}｜输出：${esc(x.output)}</p></div><button data-action="open-capability" data-id="${x.id}">查看</button></div>`).join("")}</div></div><div class="result-card risk-card"><h3>前置条件与风险</h3><ul><li>需要确认缺陷样本和标注情况。</li><li>不同光照与相机位置可能需要重新校准。</li><li>旁路接入仍需客户开放必要接口。</li></ul></div><div class="result-card"><h3>待确认信息</h3><ul>${customer.gaps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="result-card full"><h3>来源与建议追问<span>生成于 ${esc(result.generatedAt)}</span></h3><div class="source-tags">${result.experiences.slice(0,2).map(x=>`<button class="source-tag" data-action="open-experience" data-id="${x.id}">${esc(x.source)}</button>`).join("")}${result.capabilities.slice(0,3).map(x=>`<button class="source-tag" data-action="open-capability" data-id="${x.id}">${esc(x.source)}</button>`).join("")}</div><p style="margin-top:10px">建议追问：现有摄像设备覆盖范围如何？缺陷样本是否完成标注？三个月试点以什么指标验收？</p></div></div></div>`}
    function renderContext(customer,session){return `<div class="context-title"><b>共享客户画像</b><button class="button ghost small" data-action="open-customer" data-id="${customer.id}">查看</button></div><div class="context-card"><h3>${esc(customer.name)}</h3><div class="kv"><div><span>行业与阶段</span><b>${esc(customer.industry)} · ${esc(customer.scale)}</b></div><div><span>核心问题</span><b>${esc(customer.problems)}</b></div><div><span>明确约束</span><b>${esc(customer.constraints)}</b></div></div></div><div class="context-card"><h3>信息缺口</h3><ul class="unknowns">${customer.gaps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="context-card"><h3>本轮上下文规则</h3><div class="kv"><div><span>允许使用</span><b>当前画像、当前会话、已校验经验与能力</b></div><div><span>不会使用</span><b>其他客户、其他会话、待校验和已打回资产</b></div></div></div>${session.result?`<div class="context-card"><h3>本轮命中</h3><div class="kv"><div><span>经验</span><b>${session.result.experiences.length}条</b></div><div><span>原子能力</span><b>${session.result.capabilities.length}项</b></div></div></div>`:""}`}

    function renderCustomers(){const s=Store.state,verified=s.customers.filter(x=>x.status==="已确认").length;return `<div class="page"><div class="page-head"><div><h2>可复用客户画像</h2><p>一个客户只维护一份画像。当前会话不会自动修改长期画像，员工确认后才能作为客户事实复用。</p></div><div class="head-actions"><button class="button primary" data-action="new-customer">＋ 新建客户画像</button></div></div><div class="metrics"><div class="metric"><span>全部客户</span><b>${s.customers.length}</b></div><div class="metric"><span>已确认画像</span><b>${verified}</b><em>可复用</em></div><div class="metric warn"><span>待确认画像</span><b>${s.customers.length-verified}</b><em>需核对</em></div><div class="metric"><span>背景来源</span><b>${s.customers.reduce((n,x)=>n+x.sources.length,0)}</b></div></div><div class="notice"><div><strong>同一画像，两条任务线路共用</strong><p>V0.5用于快速方案；未来Deep Research继续读取同一客户画像。</p></div><button class="button small" data-action="navigate" data-view="quick">进入快速方案</button></div><div class="cards">${s.customers.map(x=>`<article class="asset-card customer-card"><div class="asset-top"><div class="customer-logo">${esc(x.name.slice(1,2)||"客")}</div><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.background)}</p><div class="profile-progress"><span style="width:${x.progress}%"></span></div><div class="tags"><span class="tag">${esc(x.industry)}</span><span class="tag">${esc(x.region)}</span><span class="tag">${x.sources.length}个来源</span></div><div class="asset-meta"><span>${x.progress}%画像完整度</span><span>${esc(x.updated)}</span></div><div class="asset-actions"><button class="button small" data-action="open-customer" data-id="${x.id}">查看画像</button><button class="button soft small" data-action="use-customer" data-id="${x.id}">发起快速方案</button></div></article>`).join("")}</div></div>`}
    function renderDocuments(){const s=Store.state,filter=s.filters.document,items=s.documents.filter(x=>filter==="全部"||x.status===filter);return `<div class="page"><div class="page-head"><div><h2>资料中心</h2><p>资料先完成同步和结构化处理，再沉淀为客户画像、经验或原子能力。审核状态与原文时效分开显示。</p></div><div class="head-actions"><button class="button primary" data-action="open-import">＋ 同步飞书资料</button></div></div><div class="metrics"><div class="metric"><span>全部资料</span><b>${s.documents.length}</b></div><div class="metric"><span>已校验</span><b>${s.documents.filter(x=>x.status==="已校验").length}</b><em>可检索</em></div><div class="metric warn"><span>待校验</span><b>${s.documents.filter(x=>x.status==="待校验").length}</b><em>不参与检索</em></div><div class="metric"><span>原文有更新</span><b>${s.documents.filter(x=>x.freshness==="原文有更新").length}</b></div></div><div class="toolbar"><div class="search"><input id="doc-search" placeholder="搜索标题、作者或标签"></div><select class="select" id="doc-filter"><option>全部</option><option ${filter==="已校验"?"selected":""}>已校验</option><option ${filter==="待校验"?"selected":""}>待校验</option><option ${filter==="已打回"?"selected":""}>已打回</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>资料</th><th>用途</th><th>作者</th><th>业务标签</th><th>审核状态</th><th>原文时效</th><th></th></tr></thead><tbody>${items.map(x=>`<tr data-search="${esc([x.title,x.author,...x.tags].join(" ").toLowerCase())}"><td><div class="doc-title"><span class="doc-icon">文</span><span><b>${esc(x.title)}</b><small>${esc(x.type)} · 修改于 ${esc(x.updated)}</small></span></div></td><td>${esc(x.purpose)}</td><td>${esc(x.author)}</td><td><div class="tag-cell">${formatTags(x.tags.slice(0,3))}</div></td><td><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></td><td><span class="badge ${x.freshness==="原文有更新"?"updated":"info"}">${esc(x.freshness)}</span></td><td><button class="button small" data-action="open-document" data-id="${x.id}">查看</button></td></tr>`).join("")}</tbody></table></div></div>`}
    function renderExperiences(){const s=Store.state,filter=s.filters.experience,items=s.experiences.filter(x=>filter==="全部"||x.status===filter);return `<div class="page"><div class="page-head"><div><h2>经验库</h2><p>回答“企业过去真实做过什么”。只有经过人工校验的经验可以参与快速方案。</p></div><div class="head-actions"><button class="button" data-action="navigate" data-view="documents">查看来源资料</button></div></div><div class="metrics"><div class="metric"><span>全部经验</span><b>${s.experiences.length}</b></div><div class="metric"><span>已校验</span><b>${s.experiences.filter(x=>x.status==="已校验").length}</b><em>可检索</em></div><div class="metric warn"><span>待校验</span><b>${s.experiences.filter(x=>x.status==="待校验").length}</b><em>需审核</em></div><div class="metric"><span>已打回</span><b>${s.experiences.filter(x=>x.status==="已打回").length}</b></div></div><div class="toolbar"><div class="search"><input id="exp-search" placeholder="搜索问题、方案、行业或来源"></div><select class="select" id="exp-filter"><option>全部</option><option ${filter==="已校验"?"selected":""}>已校验</option><option ${filter==="待校验"?"selected":""}>待校验</option><option ${filter==="已打回"?"selected":""}>已打回</option></select></div><div class="cards" id="exp-cards">${items.map(renderExperienceCard).join("")||renderEmpty("暂无经验","先从历史方案或项目复盘中提取主要经验。","查看资料中心","documents")}</div></div>`}
    function renderExperienceCard(x){return `<article class="asset-card" data-search="${esc([x.name,x.problem,x.solution,x.industry,x.source,...x.tags].join(" ").toLowerCase())}"><div class="asset-top"><span class="asset-icon exp">验</span><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.problem)}</p><div class="tags">${formatTags(x.tags)}</div><div class="asset-meta"><span>${esc(x.author)} · ${esc(x.source)}</span><span>${esc(x.updated)}</span></div><div class="asset-actions"><button class="button small" data-action="open-experience" data-id="${x.id}">${x.status==="待校验"?"审核经验":"查看详情"}</button>${x.status==="已校验"?`<button class="button soft small" data-action="use-experience" data-id="${x.id}">用于方案</button>`:""}</div></article>`}
    function renderCapabilities(){const s=Store.state,filter=s.filters.capability,items=s.capabilities.filter(x=>filter==="全部"||x.status===filter);return `<div class="page"><div class="page-head"><div><h2>原子能力库</h2><p>回答“企业现在真实能够提供什么”。每项能力必须有输入、输出和限制，才可以通过人工校验。</p></div><div class="head-actions"><button class="button" data-action="navigate" data-view="documents">导入PRD</button></div></div><div class="metrics"><div class="metric"><span>全部能力</span><b>${s.capabilities.length}</b></div><div class="metric"><span>已校验</span><b>${s.capabilities.filter(x=>x.status==="已校验").length}</b><em>可组合</em></div><div class="metric warn"><span>待校验</span><b>${s.capabilities.filter(x=>x.status==="待校验").length}</b><em>需补全</em></div><div class="metric"><span>已打回</span><b>${s.capabilities.filter(x=>x.status==="已打回").length}</b></div></div><div class="toolbar"><div class="search"><input id="cap-search" placeholder="搜索能力、输入、输出或来源PRD"></div><select class="select" id="cap-filter"><option>全部</option><option ${filter==="已校验"?"selected":""}>已校验</option><option ${filter==="待校验"?"selected":""}>待校验</option><option ${filter==="已打回"?"selected":""}>已打回</option></select></div><div class="cards" id="cap-cards">${items.map(renderCapabilityCard).join("")||renderEmpty("暂无原子能力","先从PRD中拆分可复用、可组合的企业能力。","查看资料中心","documents")}</div></div>`}
    function renderCapabilityCard(x){return `<article class="asset-card" data-search="${esc([x.name,x.problem,x.input,x.output,x.category,x.source,...x.tags].join(" ").toLowerCase())}"><div class="asset-top"><span class="asset-icon cap">能</span><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.problem)}</p><div class="tags">${formatTags(x.tags)}</div><div class="asset-meta"><span>${esc(x.author)} · ${esc(x.source)}</span><span>${esc(x.updated)}</span></div><div class="asset-actions"><button class="button small" data-action="open-capability" data-id="${x.id}">${x.status==="待校验"?"审核能力":"查看边界"}</button>${x.status==="已校验"?`<button class="button purple small" data-action="use-capability" data-id="${x.id}">用于方案</button>`:""}</div></article>`}
    function researchBadge(status){return status==="completed"?"verified":status==="failed"||status==="cancelled"?"rejected":status==="waiting_expert"?"pending":"info"}
    function activeResearch(){return Store.state.researchTasks.find(x=>x.id===Store.state.activeResearchTask)||Store.state.researchTasks[0]}
    function activeCollaboration(){return Store.state.expertCollaborations.find(x=>x.id===Store.state.activeCollaboration)||Store.state.expertCollaborations[0]}
    function renderDeep(){const s=Store.state,task=activeResearch(),stages=["需求分析","经验检索","能力检索","方案编排","事实审计"];return `<div class="page"><div class="page-head"><div><h2>Deep Research</h2><p>复杂问题进入多阶段研究；每次运行固定证据快照，并清楚展示知识缺口、失败状态与可信边界。</p></div><div class="head-actions"><button class="button" data-action="refresh-research">刷新</button><button class="button primary" data-action="new-research">＋ 新建研究</button></div></div><div class="metrics"><div class="metric"><span>全部任务</span><b>${s.researchTasks.length}</b></div><div class="metric"><span>研究中</span><b>${s.researchTasks.filter(x=>["queued","planning","researching","synthesizing"].includes(x.status)).length}</b></div><div class="metric warn"><span>等待专家</span><b>${s.researchTasks.filter(x=>x.status==="waiting_expert").length}</b></div><div class="metric"><span>已完成</span><b>${s.researchTasks.filter(x=>x.status==="completed").length}</b></div></div><div class="v1-layout"><aside class="v1-panel"><div class="v1-panel-head"><div><h3>研究任务</h3><p>选择任务查看阶段与研究报告</p></div></div><div class="v1-list">${s.researchTasks.map(x=>`<button class="v1-list-item ${task?.id===x.id?"active":""}" data-action="select-research" data-id="${x.id}"><strong>${esc(x.title)}</strong><small>${esc(x.question)}</small><div class="v1-list-meta"><span class="badge ${researchBadge(x.status)}">${esc(x.statusLabel)}</span><span>${x.progress||0}%</span></div><div class="progress-track"><i style="width:${Math.max(0,Math.min(100,x.progress||0))}%"></i></div></button>`).join("")||`<div class="v1-empty"><b>还没有研究任务</b><p>选择一份已确认客户画像，发起第一个复杂问题研究。</p><button class="button primary small" data-action="new-research">新建研究</button></div>`}</div></aside><section class="v1-panel">${task?renderResearchDetail(task,stages):`<div class="v1-empty"><b>选择一个研究任务</b><p>这里会展示阶段进度、证据快照、知识缺口和最终研究报告。</p></div>`}</section></div></div>`}
    function renderResearchDetail(task,stages){const stepMap=new Map((task.steps||[]).map(x=>[x.stage,x])),report=task.report||{},reportText=report.summary||report.executive_summary||report.conclusion||report.content||"研究完成后将在这里生成可追溯报告。";return `<div class="v1-panel-head"><div><span class="badge ${researchBadge(task.status)}">${esc(task.statusLabel)}</span><h3 style="font-size:18px;margin-top:9px">${esc(task.title)}</h3><p>${esc(task.question)}</p></div><div class="inline-actions">${task.status==="failed"?`<button class="button small" data-action="retry-research" data-id="${task.id}">重试</button>`:""}${["queued","planning","researching","synthesizing"].includes(task.status)?`<button class="button danger small" data-action="cancel-research" data-id="${task.id}">取消</button>`:""}<button class="button purple small" data-action="start-expert" data-id="${task.id}" ${task.status==="cancelled"||task.status==="failed"?"disabled":""}>发起专家协作</button></div></div><div class="state-strip"><div><b>阶段：${esc(task.stage||"等待启动")}</b><br><span>Trace ID：<span class="mono">${esc(task.trace_id||"-")}</span></span></div><strong>${task.progress||0}%</strong></div><div class="stage-list">${stages.map((name,index)=>{const step=(task.steps||[])[index]||stepMap.get(name),done=step?.status==="completed"||((task.progress||0)>=(index+1)*20),active=!done&&((task.progress||0)>=index*20);return`<div class="stage-item ${done?"done":active?"active":""}"><b>${index+1}. ${name}</b><small>${step?.status||done?"已处理":"等待中"}</small></div>`}).join("")}</div><div class="research-summary"><div class="research-stat"><span>历史经验命中</span><b>${task.evidence_snapshot?.experiences?.length||0}</b></div><div class="research-stat"><span>原子能力命中</span><b>${task.evidence_snapshot?.capabilities?.length||0}</b></div><div class="research-stat"><span>知识缺口</span><b>${task.knowledge_gaps?.length||0}</b></div></div>${task.error_summary?`<div class="error-box"><b>${esc(task.error_code||"研究失败")}</b><br>${esc(task.error_summary)}</div>`:""}<h4 class="section-title">知识缺口与待确认问题</h4><div class="gap-list">${(task.knowledge_gaps||[]).map(x=>`<div class="gap-item">${esc(x)}</div>`).join("")||`<div class="checkbox-note">当前没有记录知识缺口。</div>`}</div><div class="report-card"><h3>研究报告</h3><p>${esc(typeof reportText==="string"?reportText:JSON.stringify(reportText))}</p>${task.research_document_url?`<p><a class="button soft small" href="${esc(task.research_document_url)}" target="_blank" rel="noreferrer">打开飞书研究文档</a></p>`:""}<div class="definition-note">报告严格区分历史事实、企业能力、AI 推断和待确认信息；历史答案保留独立证据快照。</div></div>`}
    function renderExperts(){const s=Store.state,item=activeCollaboration();return `<div class="page"><div class="page-head"><div><h2>专家协作</h2><p>只能从 Deep Research 发起；员工确认专家与问题后，飞书机器人才能建群并同步同一份研究上下文。</p></div><div class="head-actions"><button class="button" data-action="refresh-collaborations">刷新</button><button class="button primary" data-action="pick-research">从研究任务发起</button></div></div><div class="v1-layout"><aside class="v1-panel"><div class="v1-panel-head"><div><h3>协作记录</h3><p>一个研究任务同时只有一个进行中协作</p></div></div><div class="v1-list">${s.expertCollaborations.map(x=>{const task=s.researchTasks.find(t=>t.id===x.research_task_id);return`<button class="v1-list-item ${item?.id===x.id?"active":""}" data-action="select-collaboration" data-id="${x.id}"><strong>${esc(x.group_name)}</strong><small>${esc(task?.title||x.research_task_id)}</small><div class="v1-list-meta"><span class="badge ${["group_created","sent","closed"].includes(x.status)?"verified":x.status==="failed"?"rejected":"pending"}">${esc(x.statusLabel)}</span><span>${esc(x.updated)}</span></div></button>`}).join("")||`<div class="v1-empty"><b>暂无专家协作</b><p>先完成或推进一项 Deep Research，再选择该任务发起协作。</p></div>`}</div></aside><section class="v1-panel">${item?renderCollaborationDetail(item):`<div class="v1-empty"><b>选择一条协作记录</b><p>系统只推荐真实 PRD 作者、历史方案作者、经验贡献者或审核人。</p><button class="button primary small" data-action="pick-research">选择研究任务</button></div>`}</section></div></div>`}
    function renderCollaborationDetail(item){const candidates=item.candidate_records||[],questions=item.questions||[],editable=["draft","awaiting_confirmation"].includes(item.status);return `<div class="v1-panel-head"><div><span class="badge ${["group_created","sent","closed"].includes(item.status)?"verified":item.status==="failed"?"rejected":"pending"}">${esc(item.statusLabel)}</span><h3 style="font-size:18px;margin-top:9px">${esc(item.group_name)}</h3><p>研究任务 <span class="mono">${esc(item.research_task_id)}</span></p></div>${item.feishu_group_id?`<span class="badge verified">飞书群已创建</span>`:""}</div><div class="field"><label>协作群名称</label><input class="input" id="collab-group-name" value="${esc(item.group_name)}" ${editable?"":"disabled"}></div><h4 class="section-title">推荐专家（最多 3 人）</h4>${candidates.length?candidates.map(x=>{const id=x.candidate_id||x.id,selected=(item.selected_expert_ids||[]).includes(String(id)),contributions=x.contributions||[];return`<label class="candidate-row"><input type="checkbox" name="expert-candidate" value="${esc(id)}" ${selected?"checked":""} ${editable?"":"disabled"}><span class="expert-avatar">${esc((x.display_name||"专")[0])}</span><span><b>${esc(x.display_name||"未命名专家")}</b><small>${esc(contributions.map(c=>c.title).join("、")||x.recommendation||"来自真实资料贡献记录")}</small></span><span class="badge info">${contributions.length} 项贡献</span></label>`}).join(""):`<div class="v1-empty"><b>暂无可推荐专家</b><p>当前证据来源中没有真实作者、贡献者或审核人记录。系统不会用演示通讯录伪造专家。</p></div>`}<h4 class="section-title">待专家确认的问题</h4><div id="collab-questions">${questions.map((q,index)=>`<div class="question-row"><textarea data-question-id="${esc(q.question_id||`question-${index+1}`)}" ${editable?"":"disabled"}>${esc(q.question||"")}</textarea><span class="checkbox-note">${q.sensitive?"敏感问题 · ":""}${esc((q.required_roles||[]).join("、"))}</span></div>`).join("")||`<div class="question-row"><textarea data-question-id="question-1" ${editable?"":"disabled"} placeholder="请输入需要专家确认的问题"></textarea></div>`}</div>${item.error_summary?`<div class="error-box">${esc(item.error_summary)}</div>`:""}<div class="inline-actions" style="margin-top:14px">${editable?`<button class="button" data-action="save-collaboration" data-id="${item.id}">保存草稿</button><button class="button primary" data-action="confirm-collaboration" data-id="${item.id}">确认专家并创建飞书群</button>`:""}${item.feishu_document_url?`<a class="button soft" href="${esc(item.feishu_document_url)}" target="_blank" rel="noreferrer">打开研究文档</a>`:""}</div><div class="definition-note">专家回复只会返回原研究任务；只有员工主动选择沉淀并人工审核后，才能进入经验库。</div>`}
    function renderDashboard(){const plans=[{name:"单产线视觉质检旁路试点",owner:"制造行业方案组",generated:18,adopted:12,rate:67},{name:"重点门店库存优化试点",owner:"零售行业方案组",generated:14,adopted:7,rate:50},{name:"客服知识辅助应答方案",owner:"企业服务方案组",generated:9,adopted:3,rate:33}];return `<div class="page"><section class="future-hero"><span class="badge updated">V1.0 规划能力</span><h2>方案采用看板，让“经验复用”变成可衡量结果</h2><p>看板关注每个方案被实际采用多少次、哪些经验和原子能力持续贡献价值，以及哪些方案生成后从未进入业务流程。采用次数不会用浏览量替代。</p></section><div class="metrics"><div class="metric"><span>生成方案</span><b>41</b><em>演示数据</em></div><div class="metric"><span>确认采用</span><b>22</b><em>演示数据</em></div><div class="metric"><span>整体采用率</span><b>54%</b></div><div class="metric"><span>被复用知识资产</span><b>17</b></div></div><div class="future-card"><h3>每个方案的实际采用情况</h3><div class="adoption-list">${plans.map(x=>`<div class="adoption-row"><div><strong>${esc(x.name)}</strong><small>${esc(x.owner)}</small></div><div><div class="adoption-bar"><i style="width:${x.rate}%"></i></div><small>采用率 ${x.rate}%</small></div><div class="adoption-number"><b>${x.generated}</b><span>生成次数</span></div><div class="adoption-number"><b>${x.adopted}</b><span>采用次数</span></div></div>`).join("")}</div></div><div class="definition-note"><b>采用口径：</b>员工明确点击“标记为已采用”，或方案链接进入已确认的项目协作流程后形成一条采用记录。仅查看、复制或生成方案不计入采用次数。当前页面全部为结构演示数据。</div></div>`}
    function renderEmpty(title,text,button,view){return `<div class="empty"><div class="empty-mark">○</div><h3>${esc(title)}</h3><p>${esc(text)}</p><button class="button primary small" data-action="navigate" data-view="${view}">${esc(button)}</button></div>`}

    const ImportState={resourceType:"document",items:[],nextPageToken:null,loading:false,error:null};
    function showImport(tab="docs") {openModal(`<div class="modal-head"><div><h2>同步或导入业务资料</h2><p>资料同步成功后再进行AI标签、经验提取、能力拆分或画像生成。</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="tabs"><button class="tab ${tab==="docs"?"active":""}" data-action="import-tab" data-tab="docs">选择飞书资料</button><button class="tab ${tab==="link"?"active":""}" data-action="import-tab" data-tab="link">粘贴链接</button><button class="tab ${tab==="text"?"active":""}" data-action="import-tab" data-tab="text">粘贴文本</button></div><div id="import-panel">${renderImportPanel(tab)}</div></div><div class="modal-foot"><button class="button" data-action="close-modal">取消</button><button class="button primary" data-action="confirm-import" data-tab="${tab}">同步并开始处理</button></div>`,true);if(tab==="docs"&&!ImportState.items.length&&!ImportState.loading)void loadFeishuResources(true)}
    function renderImportPanel(tab){if(tab==="docs")return `<div class="tabs"><button class="tab ${ImportState.resourceType==="document"?"active":""}" data-action="feishu-resource-type" data-type="document">飞书文档</button><button class="tab ${ImportState.resourceType==="minute"?"active":""}" data-action="feishu-resource-type" data-type="minute">飞书妙记</button></div><div class="field"><label>资料用途</label><select class="select" id="import-purpose"><option>经验提取</option><option>能力拆分</option><option>客户画像</option></select></div>${ImportState.loading&&!ImportState.items.length?`<div class="info">正在读取你有权限访问的飞书资料……</div>`:""}${ImportState.error?`<div class="warning">${esc(ImportState.error)}。你也可以切换到“粘贴链接”继续测试。</div>`:""}<div class="pick-list">${ImportState.items.map((item,index)=>`<label class="pick-item"><input type="checkbox" name="pick-doc" value="${index}"><span><b>${esc(item.title||"未命名资料")}</b><small>${item.resource_type==="minute"?"飞书妙记":"飞书云文档"}${item.owner_name?` · ${esc(item.owner_name)}`:""}${item.updated_at?` · ${new Date(item.updated_at).toLocaleString("zh-CN")}修改`:""}</small></span></label>`).join("")||(!ImportState.loading&&!ImportState.error?`<div class="info">当前账号没有可选择的${ImportState.resourceType==="minute"?"妙记":"文档"}。</div>`:"")}</div>${ImportState.nextPageToken?`<button class="button small" data-action="load-more-feishu">加载更多</button>`:""}<div class="info">这里只展示当前登录用户有权访问的资料；系统不会自动读取全部飞书内容。</div>`;if(tab==="link")return `<div class="field"><label>飞书文档或妙记链接</label><input class="input" id="import-link" placeholder="粘贴飞书文档或妙记链接"><div class="field-help">服务端会使用当前登录用户的授权检查读取权限。</div></div><div class="field"><label>资料用途</label><select class="select" id="import-purpose"><option>经验提取</option><option>能力拆分</option><option>客户画像</option></select></div>`;return `<div class="field"><label>资料类型</label><select class="select" id="text-type"><option>客户聊天记录</option><option>妙记转写</option><option>历史方案</option><option>PRD能力说明</option></select></div><div class="field"><label>粘贴内容</label><textarea class="textarea" id="import-text" placeholder="请粘贴真实待处理内容"></textarea></div>`}
    async function loadFeishuResources(reset=false){if(ImportState.loading)return;if(reset){ImportState.items=[];ImportState.nextPageToken=null;ImportState.error=null}ImportState.loading=true;const panel=$("#import-panel");if(panel)panel.innerHTML=renderImportPanel("docs");try{const data=await Services.listFeishuResources(ImportState.resourceType,reset?null:ImportState.nextPageToken);ImportState.items.push(...(data.items||[]));ImportState.nextPageToken=data.next_page_token||null}catch(e){ImportState.error=e.code==="AUTH_REQUIRED"?"飞书授权已过期，请重新登录":e.message}finally{ImportState.loading=false;const current=$("#import-panel");if(current)current.innerHTML=renderImportPanel("docs")}}
    function showNewCustomer(){openModal(`<div class="modal-head"><div><h2>新建客户画像</h2><p>可以直接粘贴模糊背景，AI会把缺失内容保留为空或列入信息缺口。</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="field"><label>背景来源</label><select class="select" id="profile-source"><option>粘贴客户聊天记录</option><option>飞书妙记转写</option><option>客户背景文档</option><option>销售手工输入</option></select></div><div class="field"><label>客户背景</label><textarea class="textarea" id="profile-text">客户希望快速形成一份初步方案，但目前只明确了要降低人工操作成本，现有系统和具体周期还需要继续确认。</textarea></div><div class="info">当前导入只创建待确认画像。会话中的新信息不会自动覆盖长期画像。</div></div><div class="modal-foot"><button class="button" data-action="close-modal">取消</button><button class="button primary" data-action="create-profile">生成客户画像</button></div>`)}
    function showCustomer(id){const x=Store.state.customers.find(k=>k.id===id);if(!x)return;openDrawer(`<div class="drawer-head"><div><h2>${esc(x.name)}</h2><p>${esc(x.industry)} · ${esc(x.status)} · 更新于${esc(x.updated)}</p></div><button class="close" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="detail-section"><h3>业务背景</h3><p>${esc(x.background)}</p></div><div class="detail-table"><div>现有环境</div><div>${esc(x.environment)}</div><div>核心问题</div><div>${esc(x.problems)}</div><div>业务目标</div><div>${esc(x.goals)}</div><div>约束条件</div><div>${esc(x.constraints)}</div><div>决策相关人</div><div>${esc(x.stakeholders)}</div><div>沟通偏好</div><div>${esc(x.preference)}</div></div><div class="detail-section"><h3>信息缺口</h3><ul class="unknowns">${x.gaps.map(v=>`<li>${esc(v)}</li>`).join("")}</ul></div><div class="detail-section"><h3>画像来源</h3><div class="tags">${formatTags(x.sources)}</div></div></div><div class="drawer-foot"><button class="button" data-action="close-drawer">关闭</button>${x.status==="待确认"?`<button class="button primary" data-action="confirm-customer" data-id="${x.id}">确认画像</button>`:`<button class="button soft" data-action="use-customer" data-id="${x.id}">发起快速方案</button>`}</div>`)}
    function showDocument(id){const x=Store.state.documents.find(k=>k.id===id);if(!x)return;openDrawer(`<div class="drawer-head"><div><h2>${esc(x.title)}</h2><p>${esc(x.type)} · ${esc(x.author)} · ${esc(x.updated)}</p></div><button class="close" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="detail-section"><h3>正文摘要</h3><p>${esc(x.summary)}</p></div><div class="detail-table"><div>资料用途</div><div>${esc(x.purpose)}</div><div>审核状态</div><div><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div><div>原文时效</div><div><span class="badge ${x.freshness==="原文有更新"?"updated":"info"}">${esc(x.freshness)}</span></div><div>最近同步</div><div>${esc(x.synced)}</div></div><div class="detail-section"><h3>AI业务标签</h3><div class="tags">${formatTags(x.tags)}</div></div>${x.freshness==="原文有更新"?`<div class="warning">原文已经更新。上一已校验资产可以暂时保留，但会显示“可能过期”，需要重新校验。</div>`:""}</div><div class="drawer-foot"><button class="button" data-action="close-drawer">关闭</button>${x.status==="待校验"?`<button class="button primary" data-action="navigate-asset" data-purpose="${esc(x.purpose)}">审核提取结果</button>`:""}</div>`)}
    function showExperience(id){const x=Store.state.experiences.find(k=>k.id===id);if(!x)return;const editable=x.status==="待校验";openDrawer(`<div class="drawer-head"><div><h2>${editable?"审核经验":"经验详情"}</h2><p>${esc(x.source)} · ${esc(x.author)} · ${esc(x.updated)}</p></div><button class="close" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="form-grid"><div class="field full"><label>经验名称</label><input class="input" id="exp-name" value="${esc(x.name)}" ${editable?"":"disabled"}></div><div class="field full"><label>核心问题</label><textarea class="textarea" id="exp-problem" ${editable?"":"disabled"}>${esc(x.problem)}</textarea></div><div class="field full"><label>主要方案</label><textarea class="textarea" id="exp-solution" ${editable?"":"disabled"}>${esc(x.solution)}</textarea></div><div class="field"><label>前置条件</label><textarea class="textarea" id="exp-conditions" ${editable?"":"disabled"}>${esc(x.conditions)}</textarea></div><div class="field"><label>实际结果</label><textarea class="textarea" id="exp-result" ${editable?"":"disabled"}>${esc(x.result)}</textarea></div><div class="field full"><label>适用边界</label><textarea class="textarea" id="exp-limits" ${editable?"":"disabled"}>${esc(x.limits)}</textarea></div></div>${x.foundation.includes("AI推断")?`<div class="warning">“后续铺垫”包含AI推断，只有人工确认后才能作为已校验事实使用。</div>`:""}</div><div class="drawer-foot"><button class="button" data-action="close-drawer">关闭</button>${editable?`<button class="button danger" data-action="reject-experience" data-id="${x.id}">打回</button><button class="button primary" data-action="approve-experience" data-id="${x.id}">修改后通过</button>`:`<button class="button soft" data-action="use-experience" data-id="${x.id}">用于快速方案</button>`}</div>`)}
    function showCapability(id){const x=Store.state.capabilities.find(k=>k.id===id);if(!x)return;const editable=x.status==="待校验";openDrawer(`<div class="drawer-head"><div><h2>${editable?"审核原子能力":"能力边界"}</h2><p>${esc(x.source)} · PRD作者 ${esc(x.author)}</p></div><button class="close" data-action="close-drawer">×</button></div><div class="drawer-body"><div class="form-grid"><div class="field full"><label>能力名称</label><input class="input" id="cap-name" value="${esc(x.name)}" ${editable?"":"disabled"}></div><div class="field full"><label>解决问题</label><textarea class="textarea" id="cap-problem" ${editable?"":"disabled"}>${esc(x.problem)}</textarea></div><div class="field"><label>输入 *</label><textarea class="textarea" id="cap-input" ${editable?"":"disabled"}>${esc(x.input)}</textarea></div><div class="field"><label>输出 *</label><textarea class="textarea" id="cap-output" ${editable?"":"disabled"}>${esc(x.output)}</textarea></div><div class="field full"><label>限制 *</label><textarea class="textarea" id="cap-limits" ${editable?"":"disabled"} placeholder="通过校验前必须补全">${esc(x.limits)}</textarea></div></div>${editable&&!x.limits?`<div class="warning">当前缺少“限制”。补全输入、输出和限制后才能通过校验。</div>`:`<div class="info">能力只说明企业现在能做什么，不代表已经在当前客户场景得到验证。</div>`}</div><div class="drawer-foot"><button class="button" data-action="close-drawer">关闭</button>${editable?`<button class="button danger" data-action="reject-capability" data-id="${x.id}">打回</button><button class="button primary" data-action="approve-capability" data-id="${x.id}">修改后通过</button>`:`<button class="button purple" data-action="use-capability" data-id="${x.id}">用于快速方案</button>`}</div>`)}
    function showCustomerPicker(){openModal(`<div class="modal-head"><div><h2>选择客户</h2><p>新会话将自动绑定该客户的唯一画像。</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="pick-list">${Store.state.customers.map(x=>`<button class="pick-item" style="text-align:left;background:#fff;cursor:pointer" data-action="choose-customer" data-id="${x.id}"><span class="customer-logo">${esc(x.name.slice(1,2)||"客")}</span><span class="grow"><b>${esc(x.name)}</b><small>${esc(x.industry)} · ${esc(x.problems)}</small></span><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></button>`).join("")}</div></div><div class="modal-foot"><button class="button" data-action="new-customer">＋ 新建客户</button></div>`)}

    function showNewResearch(){const confirmed=Store.state.customers.filter(x=>x.status==="已确认");openModal(`<div class="modal-head"><div><h2>新建 Deep Research</h2><p>复杂问题才进入多阶段研究，运行后保留独立证据快照。</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body">${confirmed.length?`<div class="field"><label>已确认客户画像</label><select class="select" id="research-profile">${confirmed.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>研究标题</label><input class="input" id="research-title" placeholder="例如：单产线智能质检试点研究"></div><div class="field"><label>复杂问题</label><textarea class="textarea" id="research-question" placeholder="描述需要多阶段检索、路线比较和事实审计的问题"></textarea></div><div class="field"><label>完成条件（每行一条，最多 8 条）</label><textarea class="textarea" id="research-conditions" placeholder="形成可实施路线\n列出关键风险与待确认信息"></textarea></div>`:`<div class="v1-empty"><b>没有已确认客户画像</b><p>Deep Research 必须读取已确认的长期客户画像。请先到客户画像页完成确认。</p><button class="button" data-action="navigate" data-view="customers">去确认画像</button></div>`}</div><div class="modal-foot"><button class="button" data-action="close-modal">取消</button>${confirmed.length?`<button class="button primary" data-action="create-research">启动研究</button>`:""}</div>`,true)}
    function showResearchPicker(){const available=Store.state.researchTasks.filter(x=>!["failed","cancelled"].includes(x.status));openModal(`<div class="modal-head"><div><h2>选择 Deep Research 任务</h2><p>专家协作将读取研究对话、研究文档、客户画像、证据快照和知识缺口。</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="pick-list">${available.map(x=>`<button class="pick-item" style="text-align:left;background:#fff" data-action="choose-research-for-expert" data-id="${x.id}"><span class="expert-avatar">研</span><span class="grow"><b>${esc(x.title)}</b><small>${esc(x.question)} · ${esc(x.statusLabel)}</small></span><span class="badge ${researchBadge(x.status)}">${x.progress||0}%</span></button>`).join("")||`<div class="v1-empty"><b>暂无可用研究任务</b><p>请先发起 Deep Research。</p></div>`}</div></div>`,true)}
    async function loadWorkspace(){Store.state.user=await Services.login();[Store.state.runtime,Store.state.documents,Store.state.customers,Store.state.experiences,Store.state.capabilities,Store.state.sessions,Store.state.researchTasks,Store.state.expertCollaborations]=await Promise.all([Services.health(),Services.listSources(),Services.listProfiles(),Services.listExperiences(),Services.listCapabilities(),Services.listSessions(),Services.listResearchTasks(),Services.listCollaborations()]);Store.state.activeResearchTask=Store.state.activeResearchTask||Store.state.researchTasks[0]?.id||null;Store.state.activeCollaboration=Store.state.activeCollaboration||Store.state.expertCollaborations[0]?.id||null;if(Store.state.customers.length&&Store.state.sessions.length){Store.state.activeCustomer=Store.state.customers[0].id;Store.state.activeSession=Store.state.sessions[0].id}else{Store.state.view="customers"}}
    async function doLogin(){const button=$("[data-action='login']"),invitationCode=$("#invite-code")?.value.trim();button.disabled=true;button.innerHTML=`<span class="thinking"><i></i><i></i><i></i></span> 正在连接飞书`;try{await loadWorkspace();Store.state.loggedIn=true;Store.save();render();toast("已进入企业工作空间")}catch(e){if(e.status===401||e.code==="AUTH_REQUIRED"){try{if(invitationCode)await Services.verifyInvitation(invitationCode);const auth=await Services.startLogin();if(auth.authorization_url){location.href=auth.authorization_url;return}}catch(authError){toast(authError.code==="INVITE_CODE_INVALID"?"请输入有效的邀请码":authError.message)}}else toast(e.message);button.disabled=false;button.innerHTML=`<span class="feishu-symbol">飞</span>使用飞书授权登录`}}
    async function doImport(tab){let payloads=[];if(tab==="docs"){const purpose=$("#import-purpose")?.value||"经验提取",picked=$$("input[name='pick-doc']:checked").map(x=>ImportState.items[Number(x.value)]).filter(Boolean);if(!picked.length)return toast("请至少选择一份资料");payloads=picked.map(item=>({url:item.url,title:item.title,type:item.resource_type==="minute"?"会议纪要":"飞书文档",purpose,tags:["待AI识别"]}))}else if(tab==="link"){const link=$("#import-link")?.value.trim();if(!link)return toast("请粘贴飞书文档或妙记链接");const purpose=$("#import-purpose")?.value;payloads=[{url:link,title:"通过链接同步的飞书资料",type:purpose==="能力拆分"?"PRD":purpose==="客户画像"?"客户资料":"方案",purpose,tags:["待AI识别"]}]}else{const type=$("#text-type")?.value,text=$("#import-text")?.value.trim();if(!text)return toast("请粘贴资料内容");payloads=[{title:`${type} · ${new Date().toLocaleDateString("zh-CN")}`,type,purpose:type.includes("客户")||type.includes("妙记")?"客户画像":type.includes("PRD")?"能力拆分":"经验提取",summary:text,tags:["待AI识别"]}]}const foot=$(".modal-foot");foot.innerHTML=`<button class="button primary" disabled><span class="thinking"><i></i><i></i><i></i></span> 正在同步与处理</button>`;try{const imported=[];for(const payload of payloads)imported.push(await Services.importDocument(payload));Store.state.documents=Store.state.documents.filter(x=>!imported.some(doc=>doc.id===x.id));Store.state.documents.unshift(...imported);Store.save();closeModal();render();toast(`已同步 ${imported.length} 份资料，AI提取结果等待人工校验`)}catch(e){toast(e.message);showImport(tab)}}
    async function createProfile(){const text=$("#profile-text")?.value.trim();if(!text)return toast("请先输入客户背景");const foot=$(".modal-foot");foot.innerHTML=`<button class="button primary" disabled><span class="thinking"><i></i><i></i><i></i></span> 正在生成画像</button>`;const profile=await Services.buildProfile(text);Store.state.customers.unshift(profile);Store.state.activeCustomer=profile.id;Store.save();closeModal();render();toast("已生成待确认客户画像")}
    async function runQuick(){const query=$("#quick-query")?.value.trim(),session=activeSession();if(!query)return toast("请先输入客户需求");session.query=query;session.messages=[{role:"user",text:query,time:"刚刚"}];const scroll=$("#chat-scroll");scroll.innerHTML=`${renderMessage(session.messages[0])}<div class="message"><div class="msg-avatar">AI</div><div class="bubble"><p>正在加载客户画像，并分别检索已校验经验与原子能力 <span class="thinking"><i></i><i></i><i></i></span></p><small>快速流程 · 不启动多Agent</small></div></div>`;try{session.result=await Services.quickSearch(query,session.id);const restored=await Services.loadSession(session.id);session.messages=restored.messages;session.updated="刚刚";Store.save();render();requestAnimationFrame(()=>{$("#chat-scroll")?.scrollTo(0,0)});toast("快速方案已生成")}catch(e){toast(e.message);render()}}
    async function sendFollow(){const input=$("#follow-input"),text=input?.value.trim();if(!text)return toast("请输入追问内容");const session=activeSession();input.disabled=true;try{session.result=await Services.quickSearch(text,session.id);const restored=await Services.loadSession(session.id);session.messages=restored.messages;session.updated="刚刚";Store.save();render();requestAnimationFrame(()=>{const box=$("#chat-scroll");if(box)box.scrollTop=box.scrollHeight});toast("追问已基于当前画像与可信资产完成")}catch(e){toast(e.message);input.disabled=false}}
    async function createResearch(){const profileId=$("#research-profile")?.value,question=$("#research-question")?.value.trim(),title=$("#research-title")?.value.trim(),conditions=$("#research-conditions")?.value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,8);if(!profileId||!question)return toast("请选择客户画像并输入复杂问题");const button=$("[data-action='create-research']");button.disabled=true;button.textContent="正在启动";try{const session=Store.state.sessions.find(x=>x.customerId===profileId),task=await Services.createResearchTask({customer_profile_id:profileId,session_id:session?.id||null,title:title||null,question,completion_conditions:conditions});Store.state.researchTasks.unshift(task);Store.state.activeResearchTask=task.id;Store.state.view="deep";Store.save();closeModal();render();toast("Deep Research 已启动");pollResearch(task.id)}catch(e){toast(e.message);button.disabled=false;button.textContent="启动研究"}}
    async function pollResearch(id){for(let i=0;i<120;i++){await delay(1000);try{const task=await Services.getResearchTask(id),index=Store.state.researchTasks.findIndex(x=>x.id===id);if(index>=0)Store.state.researchTasks[index]=task;else Store.state.researchTasks.unshift(task);Store.save();if(Store.state.view==="deep"&&Store.state.activeResearchTask===id)render();if(["completed","failed","cancelled","waiting_expert"].includes(task.status))return}catch(e){toast(e.message);return}}}
    async function refreshResearch(id){try{const tasks=id?[await Services.getResearchTask(id)]:await Services.listResearchTasks();if(id){const index=Store.state.researchTasks.findIndex(x=>x.id===id);if(index>=0)Store.state.researchTasks[index]=tasks[0]}else Store.state.researchTasks=tasks;Store.save();render()}catch(e){toast(e.message)}}
    async function createExpertCollaboration(taskId){try{const existing=Store.state.expertCollaborations.find(x=>x.research_task_id===taskId&&!['closed','failed'].includes(x.status));const item=existing||await Services.createCollaboration(taskId);if(!existing)Store.state.expertCollaborations.unshift(item);Store.state.activeCollaboration=item.id;Store.state.view="experts";Store.save();closeModal();render();toast(existing?"已打开该任务的进行中协作":"已生成专家候选与待确认问题")}catch(e){toast(e.message)}}
    function collaborationPayload(){const group_name=$("#collab-group-name")?.value.trim(),selected_expert_ids=$$("input[name='expert-candidate']:checked").map(x=>x.value).slice(0,3),questions=$$("#collab-questions textarea").map((x,index)=>({question_id:x.dataset.questionId||`question-${index+1}`,question:x.value.trim(),required_roles:[],sensitive:false})).filter(x=>x.question);return{group_name,selected_expert_ids,questions}}
    async function saveCollaboration(id,confirm=false){const payload=collaborationPayload();if(!payload.group_name||!payload.questions.length)return toast("群名称和至少一个问题不能为空");if(!payload.selected_expert_ids.length)return toast("请至少选择一位真实推荐专家");try{let item=await Services.updateCollaboration(id,payload);if(confirm)item=await Services.confirmCollaboration(id);const index=Store.state.expertCollaborations.findIndex(x=>x.id===id);Store.state.expertCollaborations[index]=item;Store.save();render();toast(confirm?"已确认并创建飞书协作":"草稿已保存")}catch(e){toast(e.message)}}

    document.addEventListener("click",async event=>{const button=event.target.closest("[data-action]");if(!button)return;const a=button.dataset.action;
      if(a==="login")await doLogin();
      else if(a==="logout"){Store.state.loggedIn=false;Store.state.user=null;Store.save();render()}
      else if(a==="reset-demo"){Store.reset();toast("原型数据已重置")}
      else if(a==="navigate"){Store.state.view=button.dataset.view;closeModal();render();window.scrollTo(0,0)}
      else if(a==="new-research")showNewResearch();
      else if(a==="create-research")await createResearch();
      else if(a==="select-research"){Store.state.activeResearchTask=button.dataset.id;await refreshResearch(button.dataset.id)}
      else if(a==="refresh-research")await refreshResearch();
      else if(a==="retry-research"){try{const task=await Services.retryResearchTask(button.dataset.id),index=Store.state.researchTasks.findIndex(x=>x.id===task.id);Store.state.researchTasks[index]=task;render();pollResearch(task.id)}catch(e){toast(e.message)}}
      else if(a==="cancel-research"){try{const task=await Services.cancelResearchTask(button.dataset.id),index=Store.state.researchTasks.findIndex(x=>x.id===task.id);Store.state.researchTasks[index]=task;Store.save();render();toast("研究任务已取消")}catch(e){toast(e.message)}}
      else if(a==="start-expert")await createExpertCollaboration(button.dataset.id);
      else if(a==="pick-research")showResearchPicker();
      else if(a==="choose-research-for-expert")await createExpertCollaboration(button.dataset.id);
      else if(a==="select-collaboration"){try{const item=await Services.getCollaboration(button.dataset.id),index=Store.state.expertCollaborations.findIndex(x=>x.id===item.id);Store.state.expertCollaborations[index]=item;Store.state.activeCollaboration=item.id;Store.save();render()}catch(e){toast(e.message)}}
      else if(a==="refresh-collaborations"){try{Store.state.expertCollaborations=await Services.listCollaborations();Store.save();render()}catch(e){toast(e.message)}}
      else if(a==="save-collaboration")await saveCollaboration(button.dataset.id);
      else if(a==="confirm-collaboration")await saveCollaboration(button.dataset.id,true);
      else if(a==="open-import")showImport();
      else if(a==="import-tab")showImport(button.dataset.tab);
      else if(a==="feishu-resource-type"){ImportState.resourceType=button.dataset.type;ImportState.items=[];ImportState.nextPageToken=null;ImportState.error=null;const panel=$("#import-panel");if(panel)panel.innerHTML=renderImportPanel("docs");await loadFeishuResources(true)}
      else if(a==="load-more-feishu")await loadFeishuResources(false);
      else if(a==="confirm-import")await doImport(button.dataset.tab);
      else if(a==="close-modal")closeModal();
      else if(a==="close-drawer")closeDrawer();
      else if(a==="new-customer"){closeModal();showNewCustomer()}
      else if(a==="create-profile")await createProfile();
      else if(a==="open-customer")showCustomer(button.dataset.id);
      else if(a==="confirm-customer"){try{await Services.confirmProfile(button.dataset.id);const x=Store.state.customers.find(k=>k.id===button.dataset.id);x.status="已确认";x.progress=Math.max(x.progress,72);x.updated="刚刚";Store.save();closeDrawer();render();toast("客户画像已确认，可被多个会话复用")}catch(e){toast(e.message)}}
      else if(a==="use-customer"){try{Store.state.activeCustomer=button.dataset.id;let session=Store.state.sessions.find(x=>x.customerId===button.dataset.id);if(!session){session=await Services.createSession(button.dataset.id);Store.state.sessions.unshift(session)}Store.state.activeSession=session.id;Store.state.view="quick";Store.save();closeDrawer();closeModal();render()}catch(e){toast(e.message)}}
      else if(a==="switch-customer")showCustomerPicker();
      else if(a==="choose-customer"){try{Store.state.activeCustomer=button.dataset.id;let session=Store.state.sessions.find(x=>x.customerId===button.dataset.id);if(!session){session=await Services.createSession(button.dataset.id);Store.state.sessions.unshift(session)}Store.state.activeSession=session.id;Store.save();closeModal();render()}catch(e){toast(e.message)}}
      else if(a==="new-session"){try{const customer=activeCustomer(),session=await Services.createSession(customer.id);Store.state.sessions.unshift(session);Store.state.activeSession=session.id;Store.save();render()}catch(e){toast(e.message)}}
      else if(a==="select-session"){try{const restored=await Services.loadSession(button.dataset.id),index=Store.state.sessions.findIndex(x=>x.id===restored.id);Store.state.sessions[index]=restored;Store.state.activeSession=restored.id;Store.state.activeCustomer=restored.customerId;Store.save();render()}catch(e){toast(e.message)}}
      else if(a==="fill-query"){const input=$("#quick-query");if(input){input.value=button.dataset.text;input.focus()}}
      else if(a==="run-quick")await runQuick();
      else if(a==="send-follow")await sendFollow();
      else if(a==="open-document")showDocument(button.dataset.id);
      else if(a==="navigate-asset"){Store.state.view=button.dataset.purpose==="能力拆分"?"capabilities":"experiences";closeDrawer();render()}
      else if(a==="open-experience")showExperience(button.dataset.id);
      else if(a==="approve-experience"){try{const old=Store.state.experiences.find(k=>k.id===button.dataset.id),updated=await Services.reviewExperience(old.id,"approve",{name:$("#exp-name").value.trim(),applicable_problem:$("#exp-problem").value.trim(),solution:$("#exp-solution").value.trim(),prerequisites:$("#exp-conditions").value.trim().split(/；|\n/).filter(Boolean),result:$("#exp-result").value.trim()||null,risks:[],follow_up_foundation:old.foundation||null,applicable_conditions:$("#exp-limits").value.trim().split(/；|\n/).filter(Boolean),tags:old.tags||[]});Store.state.experiences=Store.state.experiences.map(x=>x.id===updated.id?updated:x);Store.save();closeDrawer();render();toast("经验已校验，现可参与快速检索")}catch(e){toast(e.message)}}
      else if(a==="reject-experience"){try{const updated=await Services.reviewExperience(button.dataset.id,"reject");Store.state.experiences=Store.state.experiences.map(x=>x.id===updated.id?updated:x);Store.save();closeDrawer();render();toast("经验已打回，不会参与检索")}catch(e){toast(e.message)}}
      else if(a==="use-experience"){Store.state.view="quick";closeDrawer();render();toast("已进入快速方案，可在需求中引用该经验")}
      else if(a==="open-capability")showCapability(button.dataset.id);
      else if(a==="approve-capability"){const old=Store.state.capabilities.find(k=>k.id===button.dataset.id),input=$("#cap-input").value.trim(),output=$("#cap-output").value.trim(),limits=$("#cap-limits").value.trim();if(!input||!output||!limits)return toast("输入、输出和限制必须补全");try{const updated=await Services.reviewCapability(old.id,"approve",{name:$("#cap-name").value.trim(),description:$("#cap-problem").value.trim(),inputs:input.split(/；|\n/).filter(Boolean),outputs:output.split(/；|\n/).filter(Boolean),prerequisites:old.prerequisites?old.prerequisites.split(/；|\n/).filter(Boolean):[],limitations:limits.split(/；|\n/).filter(Boolean),tags:old.tags||[]});Store.state.capabilities=Store.state.capabilities.map(x=>x.id===updated.id?updated:x);Store.save();closeDrawer();render();toast("原子能力已校验，现可参与方案组合")}catch(e){toast(e.message)}}
      else if(a==="reject-capability"){try{const updated=await Services.reviewCapability(button.dataset.id,"reject");Store.state.capabilities=Store.state.capabilities.map(x=>x.id===updated.id?updated:x);Store.save();closeDrawer();render();toast("原子能力已打回，不会参与检索")}catch(e){toast(e.message)}}
      else if(a==="use-capability"){Store.state.view="quick";closeDrawer();render();toast("已进入快速方案，可在需求中引用该能力")}
    });
    document.addEventListener("change",event=>{if(event.target.id==="doc-filter"){Store.state.filters.document=event.target.value;render()}else if(event.target.id==="exp-filter"){Store.state.filters.experience=event.target.value;render()}else if(event.target.id==="cap-filter"){Store.state.filters.capability=event.target.value;render()}});
    document.addEventListener("input",event=>{const id=event.target.id,value=event.target.value.toLowerCase();if(id==="doc-search"){$$(".data-table tbody tr").forEach(x=>x.classList.toggle("hidden",!x.dataset.search.includes(value)))}else if(id==="exp-search"){$$("#exp-cards .asset-card").forEach(x=>x.classList.toggle("hidden",!x.dataset.search.includes(value)))}else if(id==="cap-search"){$$("#cap-cards .asset-card").forEach(x=>x.classList.toggle("hidden",!x.dataset.search.includes(value)))}});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeModal();closeDrawer()}if((event.ctrlKey||event.metaKey)&&event.key==="Enter"){if($("#quick-query"))runQuick();else if($("#follow-input"))sendFollow()}});
    $("#modal-layer").addEventListener("click",event=>{if(event.target.id==="modal-layer")closeModal()});
    $("#drawer-layer").addEventListener("click",event=>{if(event.target.id==="drawer-layer")closeDrawer()});
    async function bootstrap(){Store.load();if(Store.state.loggedIn){try{await loadWorkspace()}catch(e){if(e.status===401||e.code==="AUTH_REQUIRED")Store.state.loggedIn=false;else toast(e.message)}}render()}
    CalmPet.init();void bootstrap();
  </script>
</body>
</html>
