<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V2 招标工作台</title>
  <link rel="stylesheet" href="/v2-workbench.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">淘到宝引擎 · V2</div>
      <nav><a href="/">首页</a><a href="/v2_intelligence.html">情报工作台</a><a class="active" href="/v2_tender.html">招标工作台</a></nav>
      <div class="status" id="status">连接中</div>
    </header>
    <main class="layout">
      <aside class="column"><div class="section-head"><h2>文件大纲</h2><p>按 DocumentLocation 章节聚合</p></div><div class="list" id="outline"></div></aside>
      <section class="column">
        <div class="section-head"><h1 id="title">招标响应矩阵</h1><p id="summary">加载要求、证据与风险</p></div>
        <div class="toolbar">
          <select id="tender"></select>
          <select id="filter"><option value="all">全部要求</option><option value="mandatory">强制条款</option><option value="risk">风险缺口</option></select>
          <button class="warn" id="batch">批量补充证据</button><button id="export">导出 CSV</button>
        </div>
        <div class="list" id="items"></div>
      </section>
      <aside class="column"><div class="section-head"><h2>响应审核</h2><p>AI 草稿保留，人工答案独立版本化</p></div><div class="detail" id="detail"></div></aside>
    </main>
  </div>
  <script type="module">
    import {apiFetch, esc, notice, locationText} from "/v2-workbench.js";
    const state = {tenders: [], matrix: null, items: [], selected: null, checked: new Set()};
    const $ = id => document.getElementById(id);

    async function load() {
      try {
        await apiFetch("/me");
        const data = await apiFetch("/tenders?page=1&page_size=100");
        state.tenders = data.items || [];
        $("tender").innerHTML = state.tenders.map(t => `<option value="${t.id}">${esc(t.title)}</option>`).join("");
        await loadTender();
        $("status").textContent = "已连接";
      } catch (error) { $("status").textContent = "需要登录"; notice(error.message, true); }
    }

    async function loadTender() {
      const tenderId = $("tender").value;
      if (!tenderId) return;
      const tender = state.tenders.find(row => row.id === tenderId);
      $("title").textContent = tender?.title || "招标响应矩阵";
      const matrices = await apiFetch(`/tenders/${tenderId}/response-matrices?page_size=100`);
      if (!matrices.items?.length) { state.items = []; render(); return; }
      state.matrix = await apiFetch(`/response-matrices/${matrices.items[0].id}`);
      const rows = await apiFetch(`/response-matrices/${state.matrix.id}/items`);
      state.items = rows.items || [];
      state.selected = state.items[0]?.id;
      state.checked.clear();
      render();
    }

    function render() {
      const sections = new Map();
      state.items.forEach(item => {
        const key = item.requirement.source_location?.section_path?.[0] || item.requirement.category || "未分类";
        sections.set(key, (sections.get(key) || 0) + 1);
      });
      $("outline").innerHTML = [...sections].map(([name, count]) => `<div class="row"><strong>${esc(name)}</strong><div class="meta">${count} 条要求</div></div>`).join("") || '<div class="empty">暂无文档结构</div>';
      const mode = $("filter").value;
      const rows = state.items.filter(item => mode === "all" || mode === "mandatory" && item.requirement.mandatory || mode === "risk" && item.risk_flags?.length);
      $("summary").textContent = `${state.items.length} 条要求 · ${state.items.filter(item => item.requirement.mandatory).length} 条强制 · ${state.items.filter(item => item.risk_flags?.includes("missing_evidence")).length} 个证据缺口`;
      $("items").innerHTML = rows.map(item => `<div class="row requirement ${item.requirement.mandatory ? "mandatory" : ""} ${item.id === state.selected ? "selected" : ""}" data-item="${item.id}"><label><input type="checkbox" data-select="${item.id}" ${state.checked.has(item.id) ? "checked" : ""}> <strong>${item.requirement.mandatory ? "★ " : ""}${esc(item.requirement.requirement_text)}</strong></label><div class="meta"><span class="badge">${esc(item.requirement.category)}</span><span class="badge ${item.evidence_status === "supported" ? "green" : item.risk_flags?.length ? "red" : "amber"}">${esc(item.evidence_status)}</span><span>${esc(locationText(item.requirement.source_location))}</span></div></div>`).join("") || '<div class="empty">当前筛选没有要求</div>';
      renderDetail();
    }

    function renderDetail() {
      const item = state.items.find(row => row.id === state.selected);
      if (!item) { $("detail").innerHTML = '<div class="empty">选择要求开始审核</div>'; return; }
      const req = item.requirement;
      const links = [...(item.internal_exp_links || []), ...(item.internal_cap_links || [])];
      $("detail").innerHTML = `<h3>条款原文</h3><div class="fact">${esc(req.requirement_text)}</div><div class="meta">${esc(locationText(req.source_location))}</div><h3>AI 草稿</h3><div class="answer">${esc(item.ai_draft)}</div><h3>内部证据</h3><div class="links">${links.length ? links.map(link => `<span class="badge green">${esc(link.asset_id || link.id)}</span>`).join("") : '<span class="badge red">无内部证据</span>'}</div><h3>外部上下文</h3><div class="links">${(item.external_ctx_links || []).map(link => `<span class="badge">${esc(link.snapshot_id || link.id)}</span>`).join("") || '<span class="badge">无</span>'}</div>${item.risk_flags?.length ? `<h3>风险缺口</h3><div class="risk">${esc(item.risk_flags.join(" · "))}</div>` : ""}<h3>人工答案</h3><textarea class="editor" id="answer">${esc(item.current_answer || item.ai_draft)}</textarea><div class="actions"><button class="primary" data-review="approve">Approve</button><button data-review="edit_and_approve">Edit & Approve</button><button class="warn" data-review="needs_evidence">Needs Evidence</button><button class="danger" data-review="reject">Reject</button></div><div class="meta">当前版本 v${item.version} · ${esc(item.review_status)}</div>`;
    }

    document.addEventListener("click", async event => {
      const checkbox = event.target.closest("[data-select]");
      if (checkbox) { event.stopPropagation(); checkbox.checked ? state.checked.add(checkbox.dataset.select) : state.checked.delete(checkbox.dataset.select); return; }
      const row = event.target.closest("[data-item]");
      if (row) { state.selected = row.dataset.item; render(); }
      const button = event.target.closest("[data-review]");
      if (button) {
        const item = state.items.find(row => row.id === state.selected);
        try {
          await apiFetch(`/response-matrices/${state.matrix.id}/items/${item.id}/review`, {method: "POST", body: {action: button.dataset.review, note: "V2 工作台人工审核", expected_version: item.version, current_answer: $("answer").value}});
          notice("审核结果已保存"); await loadTender();
        } catch (error) { notice(error.message, true); }
      }
    });

    $("batch").addEventListener("click", async () => {
      const items = state.items.filter(item => state.checked.has(item.id));
      if (!items.length) { notice("请先勾选响应项", true); return; }
      const expected_versions = Object.fromEntries(items.map(item => [item.id, item.version]));
      try {
        await apiFetch(`/response-matrices/${state.matrix.id}/batch-review`, {method: "POST", body: {item_ids: items.map(item => item.id), action: "needs_evidence", expected_versions, note: "V2 工作台批量补充证据"}});
        notice(`已标记 ${items.length} 项需补充证据`); await loadTender();
      } catch (error) { notice(error.message, true); }
    });

    $("export").addEventListener("click", async () => {
      if (!state.matrix) return;
      try {
        const response = await fetch(`/api/v1/response-matrices/${state.matrix.id}/export`, {credentials: "same-origin"});
        if (!response.ok) throw new Error(`导出失败 (${response.status})`);
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement("a"); link.href = url; link.download = `response-matrix-${state.matrix.id}.csv`; link.click(); URL.revokeObjectURL(url);
      } catch (error) { notice(error.message, true); }
    });
    $("tender").addEventListener("change", loadTender);
    $("filter").addEventListener("change", render);
    load();
  </script>
</body>
</html>
