name: taodaobao-local

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taodaobao}
      POSTGRES_USER: ${POSTGRES_USER:-taodaobao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      APP_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-taodaobao}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-taodaobao}
      APP_REDIS_URL: redis://redis:6379/0
      APP_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      APP_FRONTEND_REDIRECT_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}/
      APP_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_AUTH_MODE: ${AUTH_MODE:-local}
      APP_ENABLE_FEISHU: ${ENABLE_FEISHU:-false}
      APP_ENABLE_PUBLIC_INTELLIGENCE: ${ENABLE_PUBLIC_INTELLIGENCE:-false}
      APP_ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-false}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?APP_SESSION_SECRET is required}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:?APP_SECRET_ENCRYPTION_KEY is required}
      APP_LOCAL_ADMIN_USERNAME: ${APP_LOCAL_ADMIN_USERNAME:-admin}
      APP_LOCAL_ADMIN_PASSWORD: ${APP_LOCAL_ADMIN_PASSWORD:?APP_LOCAL_ADMIN_PASSWORD is required}
      APP_FILE_STORAGE_ROOT: /app/data/uploads
      APP_TENDER_STORAGE_ROOT: /app/data/uploads/tenders
      APP_PRESENTATION_EXPORT_DIR: /app/data/exports
      APP_INTEGRATION_STATE_DIR: /app/data/integrations
      APP_OPEN_ENRICH_SVC_URL: ${APP_OPEN_ENRICH_SVC_URL:-}
      APP_OPEN_ENRICH_SVC_TOKEN: ${APP_OPEN_ENRICH_SVC_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - local_files:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.cli.worker"]
    env_file: [.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-taodaobao}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-taodaobao}
      APP_REDIS_URL: redis://redis:6379/0
      APP_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      APP_FRONTEND_REDIRECT_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}/
      APP_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_AUTH_MODE: ${AUTH_MODE:-local}
      APP_ENABLE_FEISHU: ${ENABLE_FEISHU:-false}
      APP_ENABLE_PUBLIC_INTELLIGENCE: ${ENABLE_PUBLIC_INTELLIGENCE:-false}
      APP_ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-false}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?APP_SESSION_SECRET is required}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:?APP_SECRET_ENCRYPTION_KEY is required}
      APP_LOCAL_ADMIN_USERNAME: ${APP_LOCAL_ADMIN_USERNAME:-admin}
      APP_LOCAL_ADMIN_PASSWORD: ${APP_LOCAL_ADMIN_PASSWORD:?APP_LOCAL_ADMIN_PASSWORD is required}
      APP_FILE_STORAGE_ROOT: /app/data/uploads
      APP_TENDER_STORAGE_ROOT: /app/data/uploads/tenders
      APP_PRESENTATION_EXPORT_DIR: /app/data/exports
      APP_INTEGRATION_STATE_DIR: /app/data/integrations
      APP_OPEN_ENRICH_SVC_URL: ${APP_OPEN_ENRICH_SVC_URL:-}
      APP_OPEN_ENRICH_SVC_TOKEN: ${APP_OPEN_ENRICH_SVC_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - local_files:/app/data

  frontend:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro

  open-enrich-sidecar:
    profiles: ["intelligence-live"]
    build:
      context: ./sidecar/open-enrich-wrapper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BRIGHT_DATA_API_KEY: ${BRIGHT_DATA_API_KEY:-}
      BRIGHT_DATA_SERP_ZONE: ${BRIGHT_DATA_SERP_ZONE:-serp_api1}
      BRIGHT_DATA_UNLOCKER_ZONE: ${BRIGHT_DATA_UNLOCKER_ZONE:-web_unlocker1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPEN_ENRICH_MODEL: ${OPEN_ENRICH_MODEL:-qwen/qwen-plus}
      APP_OPEN_ENRICH_SVC_TOKEN: ${APP_OPEN_ENRICH_SVC_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      JOB_TTL_SECONDS: ${OPEN_ENRICH_JOB_TTL_SECONDS:-86400}
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8090"]

volumes:
  postgres_data:
  redis_data:
  local_files:
