[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xianjintuan-engine"
version = "0.1.0"
description = "AI-driven customer solution generation engine"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "cryptography>=45,<47",
    "defusedxml>=0.7,<1.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pgvector>=0.4,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0.43,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.30,<7.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
